<style>
  :root{
    --paper:#f6f1e4;
    --paper-dark:#ece4d0;
    --ink:#2e2a22;
    --ink-soft:#6b6355;
    --rule:#d9cfb4;
    --accent:#3c4f7a;
    --accent-dark:#2a3a5c;
    --danger:#a8492f;
    --gold:#b8863b;
    --white:#fffdf7;
    --radius:10px;
    --shadow: 0 6px 20px rgba(46,42,34,0.15);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Serif Bengali', serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(184,134,59,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ===== Top bar ===== */
  header{
    background:var(--white);
    border-bottom:2px solid var(--rule);
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    box-shadow:0 2px 6px rgba(0,0,0,0.04);
    z-index:20;
  }
  .brand{
    font-family:'Noto Serif Bengali', serif;
    font-size:1.3rem;
    color:var(--accent-dark);
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .search-wrap{
    flex:1;
    position:relative;
    min-width:120px;
  }
  .search-wrap input{
    width:100%;
    padding:9px 14px 9px 34px;
    border-radius:20px;
    border:1.5px solid var(--rule);
    background:var(--paper);
    font-family:inherit;
    font-size:0.95rem;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap::before{
    content:"🔍";
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    font-size:0.85rem;
    opacity:0.6;
  }
  .icon-btn{
    border:none;
    background:var(--paper-dark);
    color:var(--accent-dark);
    width:38px;height:38px;
    border-radius:50%;
    font-size:1.15rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:background .15s, transform .1s;
  }
  .icon-btn:hover{background:var(--rule);}
  .icon-btn:active{transform:scale(0.92);}

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;
    gap:6px;
    padding:8px 12px;
    background:var(--paper-dark);
    border-bottom:1px solid var(--rule);
    overflow-x:auto;
    flex-shrink:0;
  }
  .tbtn{
    border:1px solid var(--rule);
    background:var(--white);
    color:var(--ink);
    min-width:40px;
    height:38px;
    padding:0 10px;
    border-radius:8px;
    font-size:1rem;
    font-family:'Noto Serif Bengali',serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    gap:4px;
    white-space:nowrap;
    transition:background .15s, border-color .15s;
  }
  .tbtn:hover{background:var(--paper);border-color:var(--accent);}
  .tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tbtn b{font-family:serif;}

  /* ===== Main editor area ===== */
  main{
    flex:1;
    overflow:hidden;
    position:relative;
    display:flex;
  }
  .editor-scroll{
    flex:1;
    overflow-y:auto;
    padding:26px 0 40px;
    display:flex;
    justify-content:center;
  }
  .editor-inner{
    width:100%;
    max-width:680px;
    padding:0 20px;
  }
  .note-title{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Noto Serif Bengali',serif;
    font-weight:700;
    font-size:1.9rem;
    line-height:1.3;
    color:var(--ink);
    outline:none;
    margin-bottom:6px;
    padding-bottom:14px;
    border-bottom:1px solid var(--rule);
    white-space:normal;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .note-title:empty:before{
    content: attr(data-placeholder);
    color:var(--ink-soft);
    opacity:0.6;
  }
  .note-body{
    min-height:60vh;
    outline:none;
    font-size:1.05rem;
    line-height:1.85;
    padding:18px 0 200px;
    background:transparent;
  }
  .note-body h1,
  .note-body h2,
  .note-body h3,
  .note-body h4,
  .note-body h5,
  .note-body h6{
    font-family:'Noto Serif Bengali',serif;
    font-weight:700;
    color:var(--ink);
    margin:1em 0 0.5em;
  }
  .note-body h1{font-size:1.8rem;}
  .note-body h2{font-size:1.4rem;}
  .note-body h3{font-size:1.22rem;}
  .note-body h4{font-size:1.1rem;}
  .note-body h5{font-size:1rem;}
  .note-body h6{font-size:0.92rem;}
  .note-body p{margin:0 0 0.85em;}
  .note-body ul{margin:0.3em 0 0.85em 1.3em; padding:0;}
  .note-body blockquote{
    margin:0 0 0.85em 0;
    padding-left:16px;
    border-left:3px solid var(--rule);
  }
  .note-body li{margin:0.25em 0;}
  .note-body b, .note-body strong{color:var(--ink); font-weight:700;}
  .note-body u{text-decoration-color:var(--gold);}
  .note-body sup, .note-body sub{color:var(--accent-dark);}
  .note-body:empty:before{
    content: attr(data-placeholder);
    color:var(--ink-soft);
    opacity:0.6;
  }

  /* ===== Side panel (notes list) ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(46,42,34,0.35);
    opacity:0; pointer-events:none;
    transition:opacity .25s;
    z-index:29;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .side-panel{
    position:fixed;
    top:0; right:0;
    width:min(340px, 86vw);
    height:100%;
    background:var(--white);
    box-shadow:var(--shadow);
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:30;
    display:flex;
    flex-direction:column;
  }
  .side-panel.open{transform:translateX(0);}
  .side-panel-head{
    padding:16px;
    border-bottom:1px solid var(--rule);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .side-panel-head h3{
    margin:0;
    font-family:'Noto Serif Bengali',serif;
    color:var(--accent-dark);
    font-size:1.15rem;
  }
  .notes-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
  }
  .note-card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:10px 12px;
    margin-bottom:8px;
    cursor:pointer;
    position:relative;
    transition:border-color .15s, transform .1s;
  }
  .note-card:hover{border-color:var(--accent);}
  .note-card:active{transform:scale(0.98);}
  .note-card.active{border-color:var(--accent); background:#eef1fa;}
  .note-card .t{
    font-weight:600;
    font-size:0.98rem;
    color:var(--ink);
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-card .p{
    font-size:0.85rem;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-card .d{
    font-size:0.72rem;
    color:var(--gold);
    margin-top:4px;
  }
  .note-card mark{background:#f6d98a; color:inherit;}
  .del-note{
    position:absolute;
    top:8px; right:8px;
    background:none;
    border:none;
    color:var(--danger);
    font-size:1rem;
    cursor:pointer;
    opacity:0.65;
  }
  .del-note:hover{opacity:1;}
  .empty-hint{
    text-align:center;
    color:var(--ink-soft);
    padding:30px 14px;
    font-size:0.9rem;
    line-height:1.7;
  }

  /* ===== Bottom action bar ===== */
  footer{
    display:flex;
    gap:8px;
    padding:10px 12px;
    background:var(--paper-dark);
    border-top:1px solid var(--rule);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .fbtn{
    flex:1;
    min-width:120px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--rule);
    background:var(--white);
    color:var(--ink);
    font-family:'Noto Serif Bengali',serif;
    font-size:0.92rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s;
  }
  .fbtn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .fbtn.primary:hover{background:var(--accent-dark);}
  .fbtn.danger{color:var(--danger); border-color:var(--danger);}
  .fbtn.danger:hover{background:#fbe9e3;}
  .fbtn:hover{background:var(--paper);}

  /* ===== Top action bar (save / backup / restore / reset) ===== */
  .actionbar{
    display:flex;
    gap:8px;
    padding:8px 12px;
    background:var(--paper-dark);
    border-bottom:1px solid var(--rule);
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .actionbar .fbtn{flex:none; min-width:0;}

  /* ===== Math popup ===== */
  .math-popup{
    position:fixed;
    z-index:40;
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
    width:min(340px, 90vw);
    display:none;
  }
  .math-popup.show{display:block;}
  .math-popup .row-title{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:8px 2px 6px;
  }
  .math-input-row{
    display:flex;
    gap:6px;
  }
  #mathLatexInput{
    flex:1;
    padding:8px 10px;
    border:1.5px solid var(--rule);
    border-radius:8px;
    font-family:'Courier New',monospace;
    font-size:0.92rem;
    outline:none;
    direction:ltr;
    text-align:left;
  }
  #mathLatexInput:focus{border-color:var(--accent);}
  .math-preview{
    min-height:44px;
    margin-top:8px;
    padding:10px 12px;
    background:var(--paper);
    border:1px dashed var(--rule);
    border-radius:8px;
    font-size:1.1rem;
    display:flex;
    align-items:center;
    overflow-x:auto;
  }
  .math-preview .ph{color:var(--ink-soft); font-size:0.85rem; font-family:'Noto Serif Bengali',serif;}
  .math-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
  }
  .math-grid button{
    border:1px solid var(--rule);
    background:var(--paper);
    border-radius:6px;
    height:34px;
    font-size:0.95rem;
    cursor:pointer;
  }
  .math-grid button:hover{background:var(--accent); color:#fff;}
  .math-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .math-actions button{
    flex:1;
    padding:9px;
    border-radius:8px;
    border:1px solid var(--rule);
    background:var(--white);
    font-family:inherit;
    font-size:0.88rem;
    cursor:pointer;
  }
  .math-actions .insert-btn{background:var(--accent); color:#fff; border-color:var(--accent);}
  .math-actions .insert-btn:hover{background:var(--accent-dark);}
  .math-chip{
    display:inline-block;
    padding:1px 2px;
    margin:0 1px;
    background:transparent;
    border:none;
    border-radius:5px;
    cursor:pointer;
    vertical-align:middle;
    line-height:normal;
  }
  .math-chip:hover{background:#eef1fa;}
  .search-hit{
    background:#f6d98a;
    border-radius:3px;
    transition:background 1.2s ease;
  }

  /* ===== Compact toolbar / popup system ===== */
  .toolbar{
    padding:6px 12px;
  }
  .toolbar-launch{
    border:1px solid var(--rule);
    background:var(--white);
    color:var(--accent-dark);
    height:36px;
    padding:0 14px;
    border-radius:18px;
    font-size:0.95rem;
    font-family:'Noto Serif Bengali',serif;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .toolbar-launch:hover{background:var(--paper);border-color:var(--accent);}
  .tool-popup{
    position:fixed;
    z-index:41;
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:10px;
    width:min(300px, 92vw);
    display:none;
  }
  .tool-popup.show{display:block;}
  .tool-popup-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }
  .tool-popup-grid button{
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:10px 4px;
    font-size:0.85rem;
    font-family:'Noto Serif Bengali',serif;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .tool-popup-grid button span.ic{font-size:1.15rem;}
  .tool-popup-grid button:hover{background:var(--accent);color:#fff;}
  .tool-popup-grid button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .heading-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--rule);
  }
  .heading-row label{
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .heading-row select{
    flex:1;
    max-width:110px;
    padding:7px 8px;
    border-radius:8px;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    font-size:0.9rem;
    cursor:pointer;
  }
  .heading-row select:focus{outline:none;border-color:var(--accent);}

  /* ===== SVG drawing embed inside note ===== */
  .svg-embed{
    display:block;
    margin:10px 0;
    padding:6px;
    border:1px dashed var(--rule);
    border-radius:8px;
    cursor:pointer;
    background:var(--white);
    max-width:100%;
  }
  .svg-embed:hover{border-color:var(--accent);}
  .svg-embed svg{display:block; width:100%; height:auto;}

  /* ===== Toast ===== */
  .toast{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--white);
    padding:10px 18px;
    border-radius:20px;
    font-size:0.9rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== Confirm modal ===== */
  .modal-back{
    position:fixed; inset:0;
    background:rgba(46,42,34,0.45);
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
  }
  .modal-back.show{display:flex;}
  .modal-box{
    background:var(--white);
    border-radius:var(--radius);
    padding:22px;
    width:min(320px,88vw);
    text-align:center;
    box-shadow:var(--shadow);
  }
  .modal-box p{font-size:0.95rem; margin:0 0 16px; line-height:1.6;}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--rule); cursor:pointer; font-family:inherit;}
  .modal-actions .yes{background:var(--danger); color:#fff; border-color:var(--danger);}

  @media (max-width:480px){
    .brand{display:none;}
    .fbtn{font-size:0.82rem; padding:9px 6px;}
  }

  /* ===== Print ===== */
  @page{
    margin: 4.4cm 3.6cm;
  }
  @media print{
    header, .actionbar, .toolbar, footer, .side-panel, .overlay,
    .math-popup, .tool-popup, .toast, .modal-back{
      display:none !important;
    }
    body{
      height:auto;
      overflow:visible;
      background:#fff;
      display:block;
    }
    main{display:block; overflow:visible;}
    .editor-scroll{
      overflow:visible;
      padding:0;
      display:block;
    }
    .editor-inner{
      max-width:100%;
      padding:0;
    }
    .note-title{
      border-bottom:1px solid #999;
      font-size:1.6rem;
      color:#000;
    }
    .note-body{
      min-height:0;
      padding:14px 0 0;
      color:#000;
      font-size:1rem;
    }
    .note-body h1,.note-body h2,.note-body h3,.note-body h4,.note-body h5,.note-body h6{color:#000;}
    .svg-embed{border:none; padding:0;}
    .note-title:empty:before, .note-body:empty:before{content:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">🖋️ Notepad</div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search notes...">
  </div>
  <button class="icon-btn" id="openPanelBtn" title="All notes">☰</button>
</header>

<div class="actionbar">
  <button class="fbtn primary" id="saveBtn">💾 Save</button>
  <button class="fbtn" id="fileMenuBtn">📂 File ▾</button>
  <input type="file" id="restoreFile" accept=".zip" style="display:none">
  <input type="file" id="importMdFile" accept=".md,.markdown,text/markdown" multiple style="display:none">
</div>

<!-- File menu popup: export / import / print / backup / restore / reset -->
<div class="tool-popup" id="filePopup">
  <div class="tool-popup-grid">
    <button id="exportMdBtn"><span class="ic">📝</span>Export .md</button>
    <button id="importMdBtn"><span class="ic">📥</span>Import .md</button>
    <button id="printBtn"><span class="ic">🖨️</span>Print</button>
    <button id="backupBtn"><span class="ic">🗂️</span>Zip Backup</button>
    <button id="restoreBtn"><span class="ic">⬆️</span>Restore</button>
    <button id="resetBtn" style="color:var(--danger);border-color:var(--danger);"><span class="ic">🗑️</span>Reset</button>
  </div>
</div>

<div class="toolbar">
  <button class="toolbar-launch" id="toolLaunchBtn" title="Tools">🧰 Tools</button>
</div>

<!-- Compact tools popup -->
<div class="tool-popup" id="toolPopup">
  <div class="tool-popup-grid">
    <button id="btnBold" title="Bold"><span class="ic"><b>B</b></span>Bold</button>
    <button id="btnUnderline" title="Underline"><span class="ic"><u>U</u></span>Underline</button>
    <button id="btnBullet" title="Bullet list"><span class="ic">•≡</span>List</button>
    <button id="btnMath" title="Insert math"><span class="ic">∫</span>Math</button>
    <button id="btnOutdent" title="Decrease indent"><span class="ic">⇤</span>Outdent</button>
    <button id="btnIndent" title="Increase indent (left indent)"><span class="ic">⇥</span>Indent</button>
    <button id="btnNewNote" title="New note"><span class="ic">✚</span>New note</button>
  </div>
  <div class="heading-row">
    <label for="headingSelect">Heading</label>
    <select id="headingSelect" title="Heading">
      <option value="P" selected>Normal</option>
      <option value="H1">H1</option>
      <option value="H2">H2</option>
      <option value="H3">H3</option>
      <option value="H4">H4</option>
      <option value="H5">H5</option>
      <option value="H6">H6</option>
    </select>
  </div>
</div>

<main>
  <div class="editor-scroll">
    <div class="editor-inner">
      <div class="note-title" id="noteTitle" contenteditable="true" data-placeholder="Enter title..."></div>
      <div class="note-body" id="noteBody" contenteditable="true" data-placeholder="Start typing here..."></div>
    </div>
  </div>
</main>


<!-- Side panel -->
<div class="overlay" id="overlay"></div>
<div class="side-panel" id="sidePanel">
  <div class="side-panel-head">
    <h3>My Notes</h3>
    <button class="icon-btn" id="closePanelBtn">✕</button>
  </div>
  <div class="notes-list" id="notesList"></div>
</div>

<!-- Math popup -->
<div class="math-popup" id="mathPopup">
  <div class="row-title">Type below or click a button to insert</div>
  <div class="math-input-row">
    <input id="mathLatexInput" type="text" placeholder="e.g.: x^{2} + \frac{a}{b}" autocomplete="off">
  </div>
  <div class="math-preview" id="mathPreview"><span class="ph">Math preview will appear here...</span></div>
  <div class="row-title">Templates (click to insert above)</div>
  <div class="math-grid" id="mathGrid"></div>
  <div class="math-actions">
    <button id="mathCancelBtn">Cancel</button>
    <button class="insert-btn" id="mathInsertBtn">Insert</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-back" id="resetModal">
  <div class="modal-box">
    <p>Are you sure you want to delete all notes? This cannot be undone.</p>
    <div class="modal-actions">
      <button id="resetCancel">No</button>
      <button class="yes" id="resetYes">Yes, delete</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "bn_notepad_notes_v1";
  const CURRENT_KEY = "bn_notepad_current_v1";

  let notes = [];
  let currentId = null;
  let saveTimer = null;

  const el = id => document.getElementById(id);
  const titleInput = el("noteTitle");
  Object.defineProperty(titleInput, 'value', {
    get(){ return this.textContent; },
    set(v){ this.textContent = v; }
  });
  titleInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      bodyDiv.focus();
    }
  });
  titleInput.addEventListener('paste', (e)=>{
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text.replace(/[\r\n]+/g,' '));
  });
  const bodyDiv = el("noteBody");
  const notesList = el("notesList");
  const toastEl = el("toast");

  // ---------- Storage ----------
  function loadNotes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : [];
    }catch(e){ notes = []; }
  }
  function persist(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }
  function persistCurrent(){
    if(currentId) localStorage.setItem(CURRENT_KEY, currentId);
  }

  function uid(){ return 'n' + Date.now() + Math.random().toString(36).slice(2,7); }

  function plainText(html){
    const d = document.createElement('div');
    d.innerHTML = html || "";
    return (d.textContent || "").trim();
  }
  function plainSnippet(html){
    return plainText(html).slice(0,80);
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('bn-BD', {day:'numeric', month:'short'}) + ' ' +
           d.toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});
  }

  function fmtSize(n){
    const bytes = new Blob([JSON.stringify(n)]).size;
    if(bytes < 1024) return bytes + ' bytes';
    return (bytes/1024).toFixed(1) + ' KB';
  }

  // ---------- Note CRUD ----------
  function newNote(){
    const n = { id: uid(), title:"", body:"", updated: Date.now() };
    notes.unshift(n);
    currentId = n.id;
    persist(); persistCurrent();
    loadIntoEditor(n);
    renderList();
    titleInput.focus();
  }

  function getCurrent(){
    return notes.find(n => n.id === currentId);
  }

  function loadIntoEditor(n){
    titleInput.value = n.title || "";
    bodyDiv.innerHTML = n.body || "";
  }

  function saveCurrent(silent){
    let n = getCurrent();
    if(!n){
      // no current note yet -> create one only if there's content
      if(!titleInput.value.trim() && !bodyDiv.textContent.trim()) return;
      n = { id: uid(), title:"", body:"", updated: Date.now() };
      notes.unshift(n);
      currentId = n.id;
    }
    n.title = titleInput.value;
    n.body = bodyDiv.innerHTML;
    n.updated = Date.now();
    persist(); persistCurrent();
    renderList();
    if(!silent) showToast("Saved ✓");
  }

  function deleteNote(id, evt){
    if(evt) evt.stopPropagation();
    notes = notes.filter(n => n.id !== id);
    persist();
    if(currentId === id){
      currentId = null;
      titleInput.value = "";
      bodyDiv.innerHTML = "";
      if(notes.length){
        currentId = notes[0].id;
        loadIntoEditor(notes[0]);
      }
    }
    renderList();
    showToast("Note deleted");
  }

  function openNote(id){
    const n = notes.find(x => x.id === id);
    if(!n) return;
    currentId = id;
    persistCurrent();
    loadIntoEditor(n);
    renderList();
    closePanel();
    const q = el("searchInput").value.trim();
    if(q) setTimeout(()=> scrollToMatch(q), 60);
  }

  function scrollToMatch(query){
    const walker = document.createTreeWalker(bodyDiv, NodeFilter.SHOW_TEXT);
    let node;
    while((node = walker.nextNode())){
      const idx = node.nodeValue.toLowerCase().indexOf(query.toLowerCase());
      if(idx !== -1){
        try{
          const range = document.createRange();
          range.setStart(node, idx);
          range.setEnd(node, idx + query.length);
          const mark = document.createElement('span');
          mark.className = 'search-hit';
          range.surroundContents(mark);
          mark.scrollIntoView({block:'center', behavior:'smooth'});
          setTimeout(()=>{
            const parent = mark.parentNode;
            if(!parent) return;
            while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
            parent.removeChild(mark);
            parent.normalize();
          }, 1700);
        }catch(e){ /* skip if selection can't be wrapped */ }
        return;
      }
    }
    // also check the title
    if(titleInput.value.toLowerCase().includes(query.toLowerCase())){
      titleInput.focus();
      titleInput.scrollIntoView({block:'center', behavior:'smooth'});
    }
  }

  // ---------- List rendering / search ----------
  function highlight(text, q){
    if(!q) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
  }
  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function renderList(){
    const q = el("searchInput").value.trim();
    let list = notes;
    if(q){
      list = notes.filter(n => {
        const hay = (n.title + " " + plainText(n.body)).toLowerCase();
        return hay.includes(q.toLowerCase());
      });
    }
    if(!list.length){
      notesList.innerHTML = '<div class="empty-hint">'+ (q ? 'No matches found.' : 'No notes yet.<br>Click "✚ New" above to start.') +'</div>';
      return;
    }
    list = [...list].sort((a,b)=> (b.updated||0) - (a.updated||0));
    notesList.innerHTML = list.map(n => {
      const title = n.title.trim() || "Untitled note";
      const snip = plainSnippet(n.body) || "Empty note";
      return `<div class="note-card ${n.id===currentId?'active':''}" data-id="${n.id}">
        <button class="del-note" data-del="${n.id}" title="Delete">✕</button>
        <div class="t">${highlight(title,q)}</div>
        <div class="p">${highlight(snip,q)}</div>
        <div class="d">${fmtDate(n.updated)} · ${fmtSize(n)}</div>
      </div>`;
    }).join("");
  }

  notesList.addEventListener('click', e=>{
    const del = e.target.closest('[data-del]');
    if(del){ deleteNote(del.getAttribute('data-del'), e); return; }
    const card = e.target.closest('.note-card');
    if(card){ openNote(card.getAttribute('data-id')); }
  });

  // ---------- Panel open/close ----------
  const sidePanel = el("sidePanel");
  const overlay = el("overlay");
  function openPanel(){ renderList(); sidePanel.classList.add('open'); overlay.classList.add('show'); }
  function closePanel(){ sidePanel.classList.remove('open'); overlay.classList.remove('show'); }
  el("openPanelBtn").addEventListener('click', openPanel);
  el("closePanelBtn").addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);

  // swipe gestures on main editor: swipe left -> open, swipe right -> close
  let touchStartX = null;
  document.querySelector('main').addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  document.querySelector('main').addEventListener('touchend', e=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(dx < -60) openPanel();
    touchStartX = null;
  }, {passive:true});
  sidePanel.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  sidePanel.addEventListener('touchend', e=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(dx > 60) closePanel();
    touchStartX = null;
  }, {passive:true});

  // ---------- Search ----------
  el("searchInput").addEventListener('input', ()=>{
    renderList();
    if(!sidePanel.classList.contains('open')) openPanel();
  });

  // ---------- Toolbar ----------
  function exec(cmd, val){
    bodyDiv.focus();
    document.execCommand(cmd, false, val || null);
    scheduleSave();
  }
  el("btnBold").addEventListener('click', ()=>exec('bold'));
  el("btnUnderline").addEventListener('click', ()=>exec('underline'));
  el("btnBullet").addEventListener('click', ()=>exec('insertUnorderedList'));
  el("btnIndent").addEventListener('click', ()=>exec('indent'));
  el("btnOutdent").addEventListener('click', ()=>exec('outdent'));
  el("btnNewNote").addEventListener('click', ()=>{ closeToolPopup(); newNote(); });

  // ---------- Heading (H1-H6) ----------
  // Clicking into the <select> steals focus (and the browser's text
  // selection) away from the contenteditable note body, so by the time
  // "change" fires there is nothing left to apply the heading to. We
  // keep a live copy of the last real selection made inside noteBody
  // and restore it right before running the formatBlock command.
  let savedHeadingRange = null;
  document.addEventListener('selectionchange', ()=>{
    const sel = window.getSelection();
    if(sel.rangeCount === 0) return;
    const r = sel.getRangeAt(0);
    if(bodyDiv.contains(r.startContainer) && bodyDiv.contains(r.endContainer)){
      savedHeadingRange = r.cloneRange();
    }
  });

  function applyHeading(tag){
    bodyDiv.focus();
    if(savedHeadingRange){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedHeadingRange);
    }
    document.execCommand('formatBlock', false, tag);
    scheduleSave();
  }
  el("headingSelect").addEventListener('mousedown', ()=>{
    // last chance to grab the selection before the dropdown opens and
    // steals focus from the note body
    const sel = window.getSelection();
    if(sel.rangeCount > 0){
      const r = sel.getRangeAt(0);
      if(bodyDiv.contains(r.startContainer) && bodyDiv.contains(r.endContainer)){
        savedHeadingRange = r.cloneRange();
      }
    }
  });
  el("headingSelect").addEventListener('change', (e)=>{
    applyHeading(e.target.value);
  });

  // keep the heading select in sync with where the cursor currently is
  document.addEventListener('selectionchange', ()=>{
    const sel = window.getSelection();
    if(sel.rangeCount === 0 || !bodyDiv.contains(sel.getRangeAt(0).startContainer)) return;
    const block = (document.queryCommandValue('formatBlock') || '').toUpperCase();
    const headingSelect = el("headingSelect");
    if(['H1','H2','H3','H4','H5','H6'].includes(block)){
      headingSelect.value = block;
    } else {
      headingSelect.value = 'P';
    }
  });

  // ---------- Compact tools popup ----------
  const toolPopup = el("toolPopup");
  const toolLaunchBtn = el("toolLaunchBtn");
  function openToolPopup(){
    const r = toolLaunchBtn.getBoundingClientRect();
    const popupW = 300;
    let left = r.left;
    if(left + popupW > window.innerWidth - 10) left = window.innerWidth - popupW - 10;
    let top = r.bottom + 8;
    toolPopup.style.left = Math.max(10, left) + "px";
    toolPopup.style.top = top + "px";
    toolPopup.classList.add('show');
  }
  function closeToolPopup(){ toolPopup.classList.remove('show'); }
  toolLaunchBtn.addEventListener('click', ()=>{
    toolPopup.classList.contains('show') ? closeToolPopup() : openToolPopup();
  });
  document.addEventListener('click', (e)=>{
    if(toolPopup.classList.contains('show') && !toolPopup.contains(e.target) && e.target !== toolLaunchBtn){
      closeToolPopup();
    }
  });

  // ---------- File menu popup (export / import / print) ----------
  const filePopup = el("filePopup");
  const fileMenuBtn = el("fileMenuBtn");
  function openFilePopup(){
    const r = fileMenuBtn.getBoundingClientRect();
    const popupW = 300;
    let left = r.left;
    if(left + popupW > window.innerWidth - 10) left = window.innerWidth - popupW - 10;
    let top = r.bottom + 8;
    filePopup.style.left = Math.max(10, left) + "px";
    filePopup.style.top = top + "px";
    filePopup.classList.add('show');
  }
  function closeFilePopup(){ filePopup.classList.remove('show'); }
  fileMenuBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    filePopup.classList.contains('show') ? closeFilePopup() : openFilePopup();
  });
  document.addEventListener('click', (e)=>{
    if(filePopup.classList.contains('show') && !filePopup.contains(e.target) && e.target !== fileMenuBtn){
      closeFilePopup();
    }
  });
  // close this popup automatically after picking an action
  ['exportMdBtn','importMdBtn','printBtn','backupBtn','restoreBtn','resetBtn'].forEach(id=>{
    el(id).addEventListener('click', closeFilePopup);
  });
  // close popup automatically after a formatting action, so it feels like a quick-pick menu
  ['btnBold','btnUnderline','btnBullet','btnMath','btnIndent','btnOutdent'].forEach(id=>{
    el(id).addEventListener('click', closeToolPopup);
  });

  // ---------- Math popup (real rendered math via KaTeX) ----------
  const mathPopup = el("mathPopup");
  const mathInput = el("mathLatexInput");
  const mathPreview = el("mathPreview");
  const mathGrid = el("mathGrid");
  let savedRange = null;   // where to insert new math in noteBody
  let editingChip = null;  // existing chip being edited, else null

  // template snippets: label shown on button -> latex inserted at cursor in the input box
  const mathTemplates = [
    ["Fraction", "\\frac{a}{b}"],
    ["Square root", "\\sqrt{x}"],
    ["Cube root", "\\sqrt[3]{x}"],
    ["Power xⁿ", "x^{n}"],
    ["Subscript", "x_{n}"],
    ["Sum ∑", "\\sum_{i=1}^{n}"],
    ["Integral ∫", "\\int_{a}^{b}"],
    ["Limit lim", "\\lim_{x \\to 0}"],
    ["Pi π", "\\pi"],
    ["Infinity ∞", "\\infty"],
    ["≤", "\\leq"],
    ["≥", "\\geq"],
    ["≠", "\\neq"],
    ["±", "\\pm"],
    ["→", "\\to"],
    ["Theta θ", "\\theta"],
    ["Alpha α", "\\alpha"],
    ["Beta β", "\\beta"],
    ["Multiply ×", "\\times"],
    ["Divide ÷", "\\div"],
    ["Degree °", "^{\\circ}"],
    ["Approx ≈", "\\approx"],
    ["nth Root", "\\sqrt[n]{x}"],
    ["Matrix", "\\begin{matrix}a & b\\\\ c & d\\end{matrix}"]
  ];
  mathTemplates.forEach(([label, snippet])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', ()=> insertSnippetIntoInput(snippet));
    mathGrid.appendChild(b);
  });

  function insertSnippetIntoInput(snippet){
    const start = mathInput.selectionStart ?? mathInput.value.length;
    const end = mathInput.selectionEnd ?? mathInput.value.length;
    const val = mathInput.value;
    mathInput.value = val.slice(0,start) + snippet + val.slice(end);
    const cursorPos = start + snippet.length;
    mathInput.focus();
    mathInput.setSelectionRange(cursorPos, cursorPos);
    renderPreview();
  }

  function renderPreview(){
    const latex = mathInput.value.trim();
    if(!latex){
      mathPreview.innerHTML = '<span class="ph">Math preview will appear here...</span>';
      return;
    }
    try{
      katex.render(latex, mathPreview, {throwOnError:false, displayMode:false});
    }catch(err){
      mathPreview.innerHTML = '<span class="ph">Could not parse this</span>';
    }
  }
  mathInput.addEventListener('input', renderPreview);

  function saveSelectionIfInside(){
    const sel = window.getSelection();
    if(sel.rangeCount > 0){
      const r = sel.getRangeAt(0);
      if(bodyDiv.contains(r.startContainer)){
        savedRange = r.cloneRange();
        return;
      }
    }
    // fallback: put at end of note body
    const r = document.createRange();
    r.selectNodeContents(bodyDiv);
    r.collapse(false);
    savedRange = r;
  }

  function openMathPopup(anchorRect){
    const popupW = 340;
    let left = anchorRect.left;
    if(left + popupW > window.innerWidth - 10) left = window.innerWidth - popupW - 10;
    let top = anchorRect.bottom + 8;
    if(top + 320 > window.innerHeight) top = Math.max(10, anchorRect.top - 330);
    mathPopup.style.left = Math.max(10,left) + "px";
    mathPopup.style.top = top + "px";
    mathPopup.classList.add('show');
    setTimeout(()=> mathInput.focus(), 30);
  }

  el("btnMath").addEventListener('click', (e)=>{
    editingChip = null;
    saveSelectionIfInside();
    mathInput.value = "";
    renderPreview();
    openMathPopup(e.target.getBoundingClientRect());
  });

  // click an existing math chip to edit it
  bodyDiv.addEventListener('click', (e)=>{
    const chip = e.target.closest('.math-chip');
    if(!chip) return;
    editingChip = chip;
    savedRange = null;
    mathInput.value = chip.getAttribute('data-latex') || "";
    renderPreview();
    openMathPopup(chip.getBoundingClientRect());
  });

  function closeMathPopup(){
    mathPopup.classList.remove('show');
    editingChip = null;
  }
  el("mathCancelBtn").addEventListener('click', closeMathPopup);
  document.addEventListener('click', (e)=>{
    if(mathPopup.classList.contains('show') && !mathPopup.contains(e.target) &&
       e.target.id !== 'btnMath' && !e.target.closest('.math-chip')){
      closeMathPopup();
    }
  });

  el("mathInsertBtn").addEventListener('click', ()=>{
    const latex = mathInput.value.trim();
    if(!latex){ closeMathPopup(); return; }

    if(editingChip){
      editingChip.setAttribute('data-latex', latex);
      try{ katex.render(latex, editingChip, {throwOnError:false, displayMode:false}); }
      catch(err){ editingChip.textContent = latex; }
      scheduleSave();
      closeMathPopup();
      return;
    }

    const chip = document.createElement('span');
    chip.className = 'math-chip';
    chip.setAttribute('contenteditable', 'false');
    chip.setAttribute('data-latex', latex);
    try{ katex.render(latex, chip, {throwOnError:false, displayMode:false}); }
    catch(err){ chip.textContent = latex; }

    bodyDiv.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    if(savedRange) sel.addRange(savedRange);
    let range = sel.rangeCount ? sel.getRangeAt(0) : null;
    if(!range || !bodyDiv.contains(range.startContainer)){
      range = document.createRange();
      range.selectNodeContents(bodyDiv);
      range.collapse(false);
    }
    range.deleteContents();
    range.insertNode(chip);

    // place cursor right after the chip so typing can continue
    const spaceNode = document.createTextNode('\u200B');
    chip.after(spaceNode);
    const after = document.createRange();
    after.setStartAfter(spaceNode);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);

    scheduleSave();
    closeMathPopup();
  });

  // ---------- Autosave ----------
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> saveCurrent(true), 700);
  }
  titleInput.addEventListener('input', scheduleSave);
  bodyDiv.addEventListener('input', scheduleSave);
  el("saveBtn").addEventListener('click', ()=> saveCurrent(false));

  // ---------- Toast ----------
  let toastTimer=null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  // ---------- Export to Markdown ----------
  function nodeToMd(node){
    if(node.nodeType === Node.TEXT_NODE){
      return node.nodeValue.replace(/\u200B/g, '');
    }
    if(node.nodeType !== Node.ELEMENT_NODE) return '';
    const tag = node.tagName.toLowerCase();
    const inner = () => Array.from(node.childNodes).map(nodeToMd).join('');
    switch(tag){
      case 'h1': return '\n# ' + inner().trim() + '\n\n';
      case 'h2': return '\n## ' + inner().trim() + '\n\n';
      case 'h3': return '\n### ' + inner().trim() + '\n\n';
      case 'h4': return '\n#### ' + inner().trim() + '\n\n';
      case 'h5': return '\n##### ' + inner().trim() + '\n\n';
      case 'h6': return '\n###### ' + inner().trim() + '\n\n';
      case 'p': return inner().trim() + '\n\n';
      case 'div':
        if(node.classList.contains('svg-embed')){
          const svgEl2 = node.querySelector('svg');
          return svgEl2 ? '\n' + svgEl2.outerHTML + '\n\n' : '';
        }
        return inner() + '\n';
      case 'br': return '  \n';
      case 'b': case 'strong': { const t = inner(); return t.trim() ? '**' + t + '**' : t; }
      case 'i': case 'em': { const t = inner(); return t.trim() ? '*' + t + '*' : t; }
      case 'u': { const t = inner(); return t.trim() ? '<u>' + t + '</u>' : t; }
      case 'sup': return '<sup>' + inner() + '</sup>';
      case 'sub': return '<sub>' + inner() + '</sub>';
      case 'ul':
        return Array.from(node.children)
          .map(li => '- ' + Array.from(li.childNodes).map(nodeToMd).join('').trim())
          .join('\n') + '\n\n';
      case 'ol':
        return Array.from(node.children)
          .map((li, i) => (i+1) + '. ' + Array.from(li.childNodes).map(nodeToMd).join('').trim())
          .join('\n') + '\n\n';
      case 'span':
        if(node.classList.contains('math-chip')){
          return '$' + (node.getAttribute('data-latex') || '') + '$';
        }
        return inner();
      default:
        return inner();
    }
  }

  function htmlToMarkdown(rootEl){
    const raw = Array.from(rootEl.childNodes).map(nodeToMd).join('');
    return raw.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function downloadText(filename, text){
    const blob = new Blob([text], {type:'text/markdown;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }

  el("exportMdBtn").addEventListener('click', ()=>{
    saveCurrent(true);
    const title = titleInput.value.trim() || "Untitled note";
    const bodyMd = htmlToMarkdown(bodyDiv);
    const md = '# ' + title + '\n\n' + bodyMd + '\n';
    const safeTitle = title.replace(/[\\\/:*?"<>|]/g, "_").slice(0,60) || "note";
    downloadText(safeTitle + ".md", md);
    showToast("Markdown file downloaded ✓");
  });

  // ---------- Print ----------
  el("printBtn").addEventListener('click', ()=>{
    saveCurrent(true);
    window.print();
  });

  // ---------- Import from Markdown ----------
  function escapeHtmlAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function inlineMdToHtml(text){
    // Escape everything first, then re-open the small set of inline tags
    // our own exporter produces, then apply markdown inline syntax.
    let s = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    s = s.replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
    s = s.replace(/&lt;sup&gt;/g, '<sup>').replace(/&lt;\/sup&gt;/g, '</sup>');
    s = s.replace(/&lt;sub&gt;/g, '<sub>').replace(/&lt;\/sub&gt;/g, '</sub>');
    // inline math: $...$
    s = s.replace(/\$([^$]+)\$/g, (m, latex) => {
      const l = escapeHtmlAttr(latex.trim());
      return '<span class="math-chip" contenteditable="false" data-latex="'+l+'">'+l+'</span>';
    });
    // bold **text**
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    // italic *text*
    s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<i>$2</i>');
    return s;
  }

  function markdownToHtml(md){
    let lines = md.replace(/\r\n/g, '\n').split('\n');
    let title = "";
    if(lines[0] && /^#\s+/.test(lines[0])){
      title = lines[0].replace(/^#\s+/, '').trim();
      lines = lines.slice(1);
    }
    while(lines.length && lines[0].trim() === '') lines.shift();

    let html = '';
    let i = 0;
    const isBullet = l => /^[-*]\s+/.test(l);
    const isOrdered = l => /^\d+\.\s+/.test(l);
    const isHeading = l => /^#{1,6}\s+/.test(l);

    while(i < lines.length){
      const line = lines[i];
      if(line.trim() === ''){ i++; continue; }
      if(isHeading(line)){
        const level = Math.min(line.match(/^#+/)[0].length, 6);
        html += '<h'+level+'>' + inlineMdToHtml(line.replace(/^#{1,6}\s+/, '').trim()) + '</h'+level+'>';
        i++;
        continue;
      }
      if(/^<svg[\s>]/.test(line.trim())){
        let block = line;
        while(i < lines.length && !/<\/svg>\s*$/.test(lines[i])){
          i++;
          if(i < lines.length) block += '\n' + lines[i];
        }
        i++;
        html += '<div class="svg-embed" contenteditable="false">' + block.trim() + '</div>';
        continue;
      }
      if(isBullet(line) || isOrdered(line)){
        const items = [];
        while(i < lines.length && (isBullet(lines[i]) || isOrdered(lines[i]))){
          items.push(lines[i].replace(/^[-*]\s+/, '').replace(/^\d+\.\s+/, ''));
          i++;
        }
        html += '<ul>' + items.map(it => '<li>' + inlineMdToHtml(it) + '</li>').join('') + '</ul>';
        continue;
      }
      const para = [];
      while(i < lines.length && lines[i].trim() !== '' && !isHeading(lines[i]) && !isBullet(lines[i]) && !isOrdered(lines[i])){
        para.push(lines[i]);
        i++;
      }
      html += '<p>' + para.map(inlineMdToHtml).join('<br>') + '</p>';
    }
    return { title, html };
  }

  function renderAllMathChips(container){
    container.querySelectorAll('.math-chip').forEach(chip => {
      const latex = chip.getAttribute('data-latex') || '';
      try{ katex.render(latex, chip, {throwOnError:false, displayMode:false}); }
      catch(err){ chip.textContent = latex; }
    });
  }

  el("importMdBtn").addEventListener('click', ()=> el("importMdFile").click());
  el("importMdFile").addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if(!files.length) return;
    showToast("Importing...");
    try{
      const importedNotes = [];
      for(const file of files){
        const text = await file.text();
        const { title, html } = markdownToHtml(text);
        const fallbackTitle = file.name.replace(/\.(md|markdown)$/i, '');
        importedNotes.push({
          id: uid(),
          title: title || fallbackTitle,
          body: html,
          updated: Date.now()
        });
      }
      if(!importedNotes.length){ showToast("No notes found in this file"); return; }
      notes = importedNotes.concat(notes);
      currentId = importedNotes[0].id;
      loadIntoEditor(importedNotes[0]);
      renderAllMathChips(bodyDiv);
      persist(); persistCurrent();
      renderList();
      showToast(importedNotes.length + " note(s) imported ✓");
    }catch(err){
      console.error(err);
      showToast("Import failed");
    }
  });

  // ---------- Backup (zip) ----------
  el("backupBtn").addEventListener('click', async ()=>{
    if(!notes.length){ showToast("No notes to back up"); return; }
    saveCurrent(true);
    showToast("Creating zip...");
    try{
      const zip = new JSZip();
      const folder = zip.folder("notes");
      const manifest = [];
      notes.forEach((n, idx)=>{
        const safeTitle = (n.title.trim() || ("Untitled_"+(idx+1))).replace(/[\\\/:*?"<>|]/g,"_").slice(0,50);
        const fname = String(idx+1).padStart(2,'0') + "_" + safeTitle + ".html";
        const htmlDoc = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>${escapeHtml(n.title||'Untitled')}</title></head><body><h1>${escapeHtml(n.title||'')}</h1>${n.body||''}</body></html>`;
        folder.file(fname, htmlDoc);
        manifest.push({title:n.title, updated:n.updated, file:"notes/"+fname});
      });
      zip.file("manifest.json", JSON.stringify(manifest, null, 2));
      const blob = await zip.generateAsync({type:"blob"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `notepad_backup_${stamp}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      showToast("Backup downloaded ✓");
    }catch(err){
      showToast("Backup failed");
      console.error(err);
    }
  });

  // ---------- Restore (from zip backup) ----------
  el("restoreBtn").addEventListener('click', ()=> el("restoreFile").click());
  el("restoreFile").addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    e.target.value = ""; // allow picking the same file again later
    if(!file) return;
    showToast("Restoring...");
    try{
      const zip = await JSZip.loadAsync(file);
      const manifestFile = zip.file("manifest.json");
      let manifest = [];
      if(manifestFile){
        try{ manifest = JSON.parse(await manifestFile.async("string")); }catch(e2){ manifest = []; }
      }

      function extractFromHtml(html){
        const doc = new DOMParser().parseFromString(html, "text/html");
        const bodyEl = doc.body;
        let title = "", bodyHtml = "";
        if(bodyEl){
          const h1 = bodyEl.querySelector('h1');
          if(h1){ title = h1.textContent || ""; h1.remove(); }
          bodyHtml = bodyEl.innerHTML.trim();
        }
        return {title, bodyHtml};
      }

      let restored = [];
      if(manifest.length){
        for(const item of manifest){
          const f = zip.file(item.file);
          if(!f) continue;
          const html = await f.async("string");
          const {title, bodyHtml} = extractFromHtml(html);
          restored.push({
            id: uid(),
            title: item.title || title,
            body: bodyHtml,
            updated: item.updated || Date.now()
          });
        }
      } else {
        const htmlFiles = Object.keys(zip.files).filter(n => !zip.files[n].dir && n.toLowerCase().endsWith('.html'));
        for(const name of htmlFiles){
          const html = await zip.file(name).async("string");
          const {title, bodyHtml} = extractFromHtml(html);
          restored.push({ id: uid(), title, body: bodyHtml, updated: Date.now() });
        }
      }

      if(!restored.length){
        showToast("No notes found in this file");
        return;
      }

      notes = restored.concat(notes);
      currentId = restored[0].id;
      loadIntoEditor(restored[0]);
      persist(); persistCurrent();
      renderList();
      showToast(restored.length + " note(s) restored ✓");
    }catch(err){
      console.error(err);
      showToast("Restore failed — check if this is a valid backup file");
    }
  });

  // ---------- Reset ----------
  const resetModal = el("resetModal");
  el("resetBtn").addEventListener('click', ()=> resetModal.classList.add('show'));
  el("resetCancel").addEventListener('click', ()=> resetModal.classList.remove('show'));
  el("resetYes").addEventListener('click', ()=>{
    notes = [];
    currentId = null;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(CURRENT_KEY);
    titleInput.value = "";
    bodyDiv.innerHTML = "";
    renderList();
    resetModal.classList.remove('show');
    showToast("All notes reset");
  });

  // ---------- Init ----------
  function init(){
    loadNotes();
    const savedCurrent = localStorage.getItem(CURRENT_KEY);
    if(notes.length){
      const found = notes.find(n=>n.id===savedCurrent);
      const n = found || notes[0];
      currentId = n.id;
      loadIntoEditor(n);
    } else {
      newNote();
    }
    renderList();
  }
  init();

  // save when leaving page
  window.addEventListener('beforeunload', ()=> saveCurrent(true));
})();
</script>
</body>
</html>
