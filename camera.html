<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000"><title>Film Camera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Roboto,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;height:52px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:grid;place-items:center}
.ib.on{background:#fdd835;color:#000}
#ratios{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#ratios button{border:0;background:transparent;color:#bbb;font-size:14px;padding:8px 10px;border-radius:16px}
#ratios button.on{background:#fff;color:#000}
#stage{flex:1;display:grid;place-items:center;min-height:0;position:relative}
#frame{position:relative;overflow:hidden;background:#111;border-radius:4px;max-width:100%;max-height:100%;will-change:transform}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateZ(0)}
#v.mir{transform:scaleX(-1) translateZ(0)}
#grid{position:absolute;inset:0;pointer-events:none;--l:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5));background:var(--l) 33.33% 0/1px 100%,var(--l) 66.66% 0/1px 100%,var(--l) 0 33.33%/100% 1px,var(--l) 0 66.66%/100% 1px;background-repeat:no-repeat}
#bp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ring{position:absolute;width:70px;height:70px;border:2px solid #fdd835;border-radius:50%;margin:-35px 0 0 -35px;pointer-events:none;opacity:0;transform:scale(1.4)}
#ring.go{animation:f .9s ease-out forwards}
@keyframes f{0%{opacity:1;transform:scale(1.4)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#rec{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:4px 12px;border-radius:14px;font-size:14px;display:none}
#rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f33;margin-right:6px}
#fl{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.f{flex:none;scroll-snap-align:center;border:0;background:rgba(255,255,255,.1);color:#ddd;font-size:12px;padding:8px 12px;border-radius:16px;white-space:nowrap}
.f.on{background:#fdd835;color:#000;font-weight:600}
#modes{display:flex;justify-content:center;gap:28px;padding:4px}
#modes button{border:0;background:none;color:#aaa;font-size:15px;padding:6px}
#modes button.on{color:#fdd835;font-weight:600}
#bar{display:flex;justify-content:space-around;align-items:center;height:96px}
#sh{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;position:relative}
#sh::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:.15s}
#sh.v::after{background:#f33}
#sh.rc::after{inset:20px;border-radius:8px;background:#f33}
#th{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#222 center/cover;padding:0}
#pz{visibility:hidden}
#pz.show{visibility:visible}
#gal{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#000;z-index:9;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#gal.show{display:flex}
#gh{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:18px}
#gg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;align-content:start}
.it{position:relative;aspect-ratio:1;background:#222;overflow:hidden;content-visibility:auto;contain-intrinsic-size:110px}
.it img,.it video{width:100%;height:100%;object-fit:cover}
.it span{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.it b{background:rgba(0,0,0,.65);border-radius:12px;font-size:14px;padding:4px 8px;font-weight:400}
#pv{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#000;z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pv.show{display:flex}
#pv .c{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
#pv img,#pv video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#000}
#pv .r{flex:none;display:flex;justify-content:space-around;padding:10px 12px;background:#000;position:relative;z-index:2}
#pv button,#pv a{color:#fff;background:#333;border:0;border-radius:20px;padding:12px 22px;font-size:15px;text-decoration:none}
#px{background:#c62828!important}
#msg{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#333;padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#msg.show{opacity:1}
