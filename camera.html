#ratios button{border:0;background:transparent;color:#bbb;font-size:14px;padding:8px 10px;border-radius:16px}
#ratios button.on{background:#fff;color:#000}
#stage{flex:1;display:grid;place-items:center;min-height:0;position:relative}
#frame{position:relative;overflow:hidden;background:#111;border-radius:4px;max-width:100%;max-height:100%;will-change:transform}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateZ(0)}
#v.mir{transform:scaleX(-1) translateZ(0)}
#grid{position:absolute;inset:0;pointer-events:none;background:
linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% - .5px),rgba(255,255,255,.5) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% - .5px),rgba(255,255,255,.5) calc(66.66% + .5px),transparent calc(66.66% + .5px)),

@keyframes f{0%{opacity:1;transform:scale(1.4)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

.f.on{background:#fdd835;color:#000;font-weight:600}

#pv{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#000;z-index:10;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}

#msg.show{opacity:1}

 wc=null;if(WCOK()){try{wc=await initWC();if(!wc)msg("WC: কোডেক নেই",4000)}catch(e){console.error(e);msg("WC ব্যর্থ: "+(e&&e.message||e),5000);wc=null}}else msg("WC নেই: "+["VideoEncoder","AudioEncoder","AudioData","VideoFrame","Mp4Muxer"].filter(k=>!window[k]).join(","),5000)
 if(wc){wc.t0=performance.now()}
 else{
  cs=cv.captureStream(30);try{cs.getVideoTracks()[0].contentHint="motion"}catch(e){}st.stream.getAudioTracks().forEach(t=>cs.addTrack(t));
  const mt=pick(),ch=[];
  const r=new MediaRecorder(cs,{mimeType:mt||undefined,videoBitsPerSecond:12e6,audioBitsPerSecond:128e3});
  r.ondataavailable=e=>e.data.size&&ch.push(e.data);
  r.onstop=async()=>{const type=(r.mimeType||mt||"video/webm").split(";")[0],ext=type.includes("mp4")?"mp4":"webm";const blob=new Blob(ch,{type});st.rec=null;await save({type:"video",blob,ext})};
  draw(cx,d0);r.start(1000);st.rec=r;
 }
 paused=false;acc=0;t0=performance.now();st.init=false;
 loop();tmr=setInterval(tick,250);
 $("sh").classList.add("rc");$("pz").classList.add("show");$("rec").style.display="block";$("modes").style.visibility="hidden";
}
function tick(){const n=acc+(paused?0:performance.now()-t0),s=Math.floor(n/1000);$("tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
const to=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
async function stopRec(){
 if(st.init||st.stopping)return;st.stopping=true;
 clearInterval(tmr);try{wl&&wl.release();wl=null}catch(e){}
 $("sh").classList.remove("rc");$("pz").classList.remove("show");$("rec").style.display="none";$("modes").style.visibility="visible";$("pz").textContent="⏸";
 if(wc){
  const o=wc;msg("সংরক্ষণ হচ্ছে…");
  try{
   if(!paused){draw(cx,d0);encFrame(true)}
   flushA();
   if(o.ae){const T=(paused?o.ps-o.t0-o.pt:performance.now()-o.t0-o.pt)/1000,n=Math.round((T-o.af/o.sr)*o.sr);
    if(n>0&&n<o.sr*2){o.buf.push(new Float32Array(n));o.bn+=n;flushA()}}
  }catch(e){console.error(e)}
  o.end=true;st.rec=null;
  try{o.node&&o.node.disconnect()}catch(e){}
  try{await to(o.ve.flush(),4000);if(o.ae)await to(o.ae.flush(),4000)}catch(e){console.error(e)}
  try{
   o.mux.finalize();
   const blob=new Blob([o.mux.target.buffer],{type:"video/mp4"});
   await save({type:"video",blob,ext:"mp4"});
  }catch(e){console.error(e);msg("সংরক্ষণ হয়নি")}
  try{o.ve.close()}catch(e){}try{o.ae&&o.ae.close()}catch(e){}try{o.ac&&o.ac.close()}catch(e){}
  wc=null;st.stopping=false;
 }else{const r=st.rec;st.stopping=false;if(r&&r.state!=="inactive")r.stop()}
}
$("pz").onclick=()=>{if(!st.rec||st.init)return;
 if(!paused){if(wc)flushA();paused=true;acc+=performance.now()-t0;if(wc)wc.ps=performance.now();else st.rec.pause();$("pz").textContent="▶"}
 else{if(wc)wc.pt+=performance.now()-wc.ps;else st.rec.resume();paused=false;t0=performance.now();$("pz").textContent="⏸"}};
$("sh").onclick=()=>{if(st.mode==="p")photo();else if(st.rec)stopRec();else startRec()};
function mode(m){if(st.rec||st.mode===m)return;st.mode=m;setRes(m);$("mp").classList.toggle("on",m==="p");$("mv").classList.toggle("on",m==="v");$("sh").classList.toggle("v",m==="v")}
$("mp").onclick=()=>mode("p");$("mv").onclick=()=>mode("v");
// Gallery
let cur=null;
function fillIt(d,o){
 d.textContent="";
 if(o.t){const u=URL.createObjectURL(o.t);st.urls.push(u);const im=new Image();im.loading="lazy";im.decoding="async";im.src=u;d.appendChild(im)}
 if(o.kind==="video"){const sp=document.createElement("span");sp.innerHTML="<b>▶</b>";d.appendChild(sp)}
}
let gtok=0;
async function openGal(){
 const tok=++gtok,g=$("gg");
 const recs=await tAll(),have=new Set(recs.map(x=>x.id)),keys=await mKeys();
 const list=recs.slice();keys.forEach(k=>{if(!have.has(k))list.push({id:k,pending:true})});
 list.sort((a,b)=>b.id-a.id);
 (st.urls||[]).forEach(URL.revokeObjectURL);st.urls=[];g.textContent="";
 const fg=document.createDocumentFragment(),pend=[];
 list.forEach(o=>{const d=document.createElement("div");d.className="it";d.dataset.id=o.id;fillIt(d,o);d.onclick=()=>openItem(o.id);fg.appendChild(d);if(o.pending)pend.push([o.id,d])});
 g.appendChild(fg);
 if(!list.length)g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#888;padding:40px">কিছু নেই</p>';
 $("gal").classList.add("show");
 // পুরনো ফাইলের থামনেইল ব্যাকগ্রাউন্ডে একটা একটা করে বানানো হবে
 for(const [id,d] of pend){
  if(tok!==gtok||!$("gal").classList.contains("show"))break;
  const m=await dbGet(id);if(!m)continue;
  const t=await mkThumb(m.blob,m.kind);const r={id,kind:m.kind,ext:m.ext,t};await tPut(r);
  if(tok===gtok&&d.isConnected)fillIt(d,r);
  await new Promise(r=>setTimeout(r,30));
 }
}
async function openItem(id){const o=await dbGet(id);if(o)show(o)}
function show(o){cur=o;const u=URL.createObjectURL(o.blob);st.pu=u;
 $("pc").innerHTML=o.kind==="image"?`<img src="${u}">`:`<video src="${u}" controls autoplay playsinline></video>`;
 const a=$("pd");a.href=u;a.download=(o.kind==="image"?"IMG_":"VID_")+o.id+"."+o.ext;$("pv").classList.add("show")}
function closePv(){const vd=$("pc").querySelector("video");if(vd)vd.pause();$("pc").innerHTML="";$("pv").classList.remove("show");const u=st.pu;st.pu=null;if(u)setTimeout(()=>URL.revokeObjectURL(u),60000)}
$("pb").onclick=closePv;
// ডাউনলোড করলে অটো মুছে যাবে
$("pd").onclick=()=>{const o=cur;if(!o)return;setTimeout(async()=>{await dbDel(o.id);closePv();openGal();msg("ডাউনলোড হয়েছে, মুছে ফেলা হয়েছে",2500)},1500)};
$("px").onclick=async()=>{if(!cur||!confirm("মুছবেন?"))return;await dbDel(cur.id);closePv();openGal()};
$("th").onclick=openGal;$("gb").onclick=()=>{gtok++;$("gal").classList.remove("show")};
// Init
(async()=>{const all=(await tAll()).filter(o=>o.kind==="image"&&o.t).sort((a,b)=>b.id-a.id);if(all[0])setTh(all[0].t)})();
layout();start();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!st.rec&&(!st.stream||!st.stream.active))start()});
</script></body></html>
