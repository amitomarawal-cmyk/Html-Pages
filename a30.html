const E=[0,[4,20,["L0-19"],10],[7,30,["L0-28"],15],[11,20,["H012","#H"],10],[14,50,["H012","T","#H"],20],[18,20,["#M"],10],[21,50,["#M","#N"],20],[25,30,["#W","#Q","#M"],15],[30,100,["L0-28","H012","T","#M","#N","#W","#Q"],30]];
const XD={};E.forEach((e,n)=>{if(e)XD[e[0]]=n});
const SPD={13:["#H"],14:["H012","T"],15:["#M"],16:["#M"],17:["#M"],18:["#M"],19:["#N"],20:["#N"],21:["#M","#N"],22:["#W"],23:["#W"],24:["#Q"],25:["#Q"],26:["#Q"],27:["#Q"],28:["#Q"],29:["#M","#N","#W"],30:["#M","#N","#W","#Q"]};
const spec=d=>{const [t,k,a]=D[d-1];return SPD[d]||(k=="L"?["L"+a[0]+"-"+a[1]]:k=="H"?["H"+a.join("")]:k=="T"?["T"]:["#H"])};
const opts=(c,x)=>[...new Set(x)].filter(v=>v!=c).slice(0,3);
function gen(sp){const P=[];sp.forEach(t=>{let m;
if(m=t.match(/^L(\d+)-(\d+)$/)){for(let i=+m[1];i<=+m[2];i++){const l=L[i],o=sh(L.filter(x=>x!=l));
P.push({q:"এই হরফের নাম কী?",ar:l[0],c:l[1],w:opts(l[1],o.map(x=>x[1]))},
{q:"এই হরফ কোথা থেকে উচ্চারিত হয়?",ar:l[0],c:GN[l[3]],w:GN.filter((g,j)=>j!=l[3])},
{q:"‘"+l[1]+"’ কোনটি?",c:l[0],w:o.slice(0,3).map(x=>x[0])})}}
else if(m=t.match(/^H(\d*)$/)){[...m[1]].forEach(h=>{h=+h;L.forEach(l=>{const o=sh(L);
P.push({q:"এই হরফের উচ্চারণ কী?",ar:l[0]+HM[h],c:syl(l,h),w:opts(syl(l,h),[syl(l,(h+1)%3),syl(l,(h+2)%3),...o.map(x=>syl(x,h))])},
{q:"এই হরকতের নাম কী?",ar:l[0]+HM[h],c:HN[h],w:[...HN.filter((x,j)=>j!=h),"সুকুন"]})})})}
else if(t=="T"){[0,1,2].forEach(h=>L.forEach(l=>{const s=syl(l,h)+"ন";
P.push({q:"এই তানবীনের উচ্চারণ কী?",ar:l[0]+HM[3+h],c:s,w:opts(s,[syl(l,(h+1)%3)+"ন",syl(l,(h+2)%3)+"ন",...sh(L).map(x=>syl(x,h)+"ন")])},
{q:"এটি কোন তানবীন?",ar:l[0]+HM[3+h],c:TN[h],w:TN.filter((x,j)=>j!=h)})}))}
else if(t[0]=="#")HW.filter(x=>x.t==t[1]).forEach(x=>P.push(x))});return P}
const pass=n=>S.x[n]!=null&&S.x[n]>=E[n][1]*.6;
let Z=null,BK=()=>home();
function view(h,t,b){BK=b;$("#app").innerHTML=`<div class="tb"><button class="bk" onclick="BK()" aria-label="ফিরে যাও">‹</button><b>${t}</b></div>${h}`;scrollTo(0,0)}
const tl=(ic,lb,sb,c,f)=>`<button class="tl ${c}" onclick="${f}"><span class="ic">${ic}</span><b>${lb}</b><small>${sb}</small></button>`;
const icon=d=>{const [t,k,a]=D[d-1];return k=="L"?`<span class="ar">${L[a[0]][0]}</span>`:k=="H"?`<span class="ar">ب${HM[a[0]]}</span>`:k=="T"?`<span class="ar">ب${HM[3]}</span>`:k=="S"?`<span class="ar">ب&zwj;</span>`:k=="R"?"📖":k=="Q"?"📜":d==30?"🏆":"🔁"};
const LV=[["লেভেল ১ · হরফ চেনা",1,7],["লেভেল ২ · হরকত ও জোড়া",8,14],["লেভেল ৩ · মদ, সুকুন ও তাজবিদ",15,21],["লেভেল ৪ · ওয়াক্ফ ও সূরা",22,30]];
function home(){const dn=Object.keys(S.d).length,xp=E.filter((e,n)=>n&&pass(n)).length;
let h=`<div class="hd"><h1>৩০ দিনে কুরআন পড়া</h1><span class="mu">নূরানী পদ্ধতি · বাংলা উচ্চারণসহ · ৮টি পরীক্ষা</span><div class="pg"><i style="width:${dn/30*100}%"></i></div><span class="mu">${bn(dn)}/৩০ দিন শেষ · ${bn(xp)}/৮ পরীক্ষা পাস</span></div>`;
LV.forEach(v=>{let c=0,g="";for(let d=v[1];d<=v[2];d++){if(S.d[d])c++;g+=tl(icon(d),"দিন "+bn(d),D[d-1][0],(S.d[d]?"dn ":"")+(XD[d]?"ex":""),`go(${d})`)}
h+=`<div class="lv"><h2>${v[0]}</h2><small>${bn(c)}/${bn(v[2]-v[1]+1)}</small></div><div class="ap">${g}</div>`});
h+=`<div class="lv"><h2>পরীক্ষা</h2></div><div class="ap">`;
for(let n=1;n<=8;n++)h+=tl("📝","পরীক্ষা "+bn(n),S.x[n]!=null?bn(S.x[n])+"/"+bn(E[n][1]):"দিন "+bn(E[n][0]),(pass(n)?"dn ":"")+"ex",`exam(${n})`);
$("#app").innerHTML=h+"</div>";scrollTo(0,0)}
const ch=l=>`<div class="cd" style="--c:${C[l[3]]}"><div class="ar">${l[0]}</div><b>${l[1]}</b><small>${l[4]}<br>${GN[l[3]]}</small></div>`;
function body(d){const [t,k,a]=D[d-1];
if(k=="L"){let s="";for(let i=a[0];i<=a[1];i++)s+=ch(L[i]);return `<div class="cs">${s}</div><div class="lg">${GN.map((g,i)=>`<span><i style="background:${C[i]}"></i>${g}</span>`).join("")}</div>`}
if(k=="H"){let s=`<table><tr><th>হরফ</th>${a.map(i=>`<th>${HN[i]}</th>`).join("")}</tr>`;
L.forEach(l=>{s+=`<tr><td><span class="ar">${l[0]}</span></td>${a.map(i=>`<td><span class="ar">${l[0]+HM[i]}</span><small>${syl(l,i)}</small></td>`).join("")}</tr>`});return s+"</table>"}
if(k=="S"){let s="<table><tr><th>একা</th><th>শুরু</th><th>মাঝ</th><th>শেষ</th></tr>";
L.forEach(l=>{const c=l[0];s+=`<tr><td><span class="ar">${c}</span></td><td><span class="ar">${c}&zwj;</span></td><td><span class="ar">&zwj;${c}&zwj;</span></td><td><span class="ar">&zwj;${c}</span></td></tr>`});return s+"</table>"}
if(k=="T"){let s="<table><tr><th>হরফ</th>"+TN.map(x=>`<th>${x}</th>`).join("")+"</tr>";
L.forEach(l=>{s+=`<tr><td><span class="ar">${l[0]}</span></td>${[0,1,2].map(i=>`<td><span class="ar">${l[0]+HM[3+i]}</span><small>${syl(l,i)}ন</small></td>`).join("")}</tr>`});return s+"</table>"}
if(k=="R")return a.map(x=>`<div class="rw"><div class="ar">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]||""}</small></div></div>`).join("");
if(k=="Q")return a.map(i=>`<h2>${SU[i][0]}</h2>`+SU[i][1].map(x=>`<div class="rw"><div class="ar">${x[0]}</div><div><b>${x[1]}</b></div></div>`).join("")).join("");return ""}
function go(d){const [t,k,a,tx]=D[d-1],n=XD[d];
view(`<h2>${t}</h2><p>${tx||DEF}</p><details><summary>আজকের রুটিন (৩০–৪৫ মিনিট)</summary>৫ মিনিট আগের পাঠ রিভিশন · ১৫–২০ মিনিট নতুন পাঠ · ১০ মিনিট ক্বারীর সাথে জোরে পড়া · ৫ মিনিট না দেখে বলার চেষ্টা</details>${body(d)}
<div class="bx"><b>অনুশীলন কুইজ</b><p class="mu">৫টি MCQ, প্রতিবার নতুন প্রশ্ন। ৬০%+ পেলে দিন সম্পন্ন হবে।</p><button class="bt" onclick="start(0,${d})">কুইজ শুরু করো</button></div>
${n?`<div class="bx ex"><b>📝 পরীক্ষা ${bn(n)} · ${bn(E[n][1])} নম্বর · ${bn(E[n][3])}টি MCQ</b><p class="mu">${S.x[n]!=null?"সেরা ফল: "+bn(S.x[n])+"/"+bn(E[n][1])+(pass(n)?" ✅ পাস":" · আবার চেষ্টা করো"):"পাস নম্বর ৬০%"}</p><button class="bt" onclick="exam(${n})">পরীক্ষা শুরু করো</button></div>`:""}
<button class="bt o" onclick="done(${d})">${S.d[d]?"✓ শেষ হয়েছে (বাতিল করো)":"আজকের পাঠ শেষ"}</button>${d>1?`<button class="bt o" onclick="go(${d-1})">‹ আগের</button>`:""}${d<30?`<button class="bt o" onclick="go(${d+1})">পরের ›</button>`:""}`,"দিন "+bn(d),home)}
function done(d){S.d[d]?delete S.d[d]:S.d[d]=1;save();go(d)}
function exam(n){const e=E[n];view(`<h2>পরীক্ষা ${bn(n)}</h2><div class="bx ex"><p>দিন ${bn(e[0])} · ${bn(e[1])} নম্বর · ${bn(e[3])}টি MCQ। প্রশ্ন প্রতিবার র‍্যান্ডম আসে। পাস নম্বর ৬০%।</p><p class="mu">${S.x[n]!=null?"সেরা ফল: "+bn(S.x[n])+"/"+bn(e[1]):"এখনও দেওয়া হয়নি"}</p><button class="bt" onclick="start(${n})">শুরু করো</button></div>`,"পরীক্ষা "+bn(n),home)}
function start(n,day){const sp=n?E[n][2]:spec(day),P=sh(gen(sp)),c=n?E[n][3]:5;
Z={n,day,P:P.slice(0,Math.min(c,P.length)),k:0,ok:0,bad:[],t:n?"পরীক্ষা "+bn(n):"কুইজ · দিন "+bn(day)};ask()}
function ask(){const z=Z,p=z.P[z.k],o=sh([p.c,...p.w]);
view(`<div class="pg"><i style="width:${z.k/z.P.length*100}%"></i></div><small>প্রশ্ন ${bn(z.k+1)}/${bn(z.P.length)}</small><h2>${p.q}</h2>${p.ar?`<div class="ar big">${p.ar}</div>`:""}<div class="ops">${o.map(x=>`<button class="op${isA(x)&&x.length<12?" ar":""}">${x}</button>`).join("")}</div><div id="fb"></div>`,z.t,()=>z.n?exam(z.n):go(z.day));
const bs=document.querySelectorAll(".op");
bs.forEach((b,i)=>b.onclick=()=>{const r=o[i]==p.c;r?z.ok++:z.bad.push(p);
bs.forEach((x,j)=>{x.disabled=1;if(o[j]==p.c)x.classList.add("y");else if(j==i)x.classList.add("n")});
$("#fb").innerHTML=`<p class="${r?"yy":"nn"}">${r?"✅ সঠিক":"❌ ভুল। সঠিক উত্তর: "+p.c}</p><button class="bt" onclick="nx()">${z.k+1<z.P.length?"পরের প্রশ্ন":"ফলাফল দেখো"}</button>`})}
function nx(){Z.k++;Z.k<Z.P.length?ask():fin()}
function fin(){const z=Z,t=z.P.length,pc=Math.round(z.ok/t*100),ps=pc>=60;let m=0;
if(z.n){m=Math.round(z.ok/t*E[z.n][1]);if(S.x[z.n]==null||m>S.x[z.n])S.x[z.n]=m;if(ps)S.d[E[z.n][0]]=1}else if(ps)S.d[z.day]=1;save();
view(`<div class="bx" style="text-align:center"><p class="sc">${bn(pc)}%</p><p><b>${bn(z.ok)}/${bn(t)} সঠিক</b>${z.n?` · ${bn(m)}/${bn(E[z.n][1])} নম্বর`:""}</p><p class="${ps?"yy":"nn"}">${ps?"✅ পাস! মাশাআল্লাহ":"৬০% লাগবে। পাঠটা আবার পড়ে নতুন প্রশ্নে চেষ্টা করো।"}</p>
<button class="bt" onclick="start(${z.n},${z.day||0})">আবার (নতুন প্রশ্ন)</button><button class="bt o" onclick="BK()">ফিরে যাও</button></div>
${z.bad.length?`<h2>যেগুলো ভুল হয়েছে</h2>`+z.bad.map(p=>`<div class="wr"><b>${p.q}</b>${p.ar?`<div class="ar">${p.ar}</div>`:""}<span class="yy">সঠিক: ${p.c}</span></div>`).join(""):""}`,z.t+" · ফলাফল",()=>z.n?exam(z.n):go(z.day))}
home();
</script></body></html>
