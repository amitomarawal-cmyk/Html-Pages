.sl{display:flex;align-items:center;gap:8px;font-size:13px}
.sl input{flex:1;min-width:80px;accent-color:var(--ac)}

.hint{display:none}
button{font-size:16px}
#bar button{font-size:21px}
.scr{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;align-items:center}
.sw{width:30px;height:30px;padding:0;flex:none;border:2px solid var(--bd);border-radius:6px}
.sw.on{border-color:var(--ac)}
.fl{display:flex;flex-wrap:wrap;gap:6px}
.th{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.th div{flex:none;text-align:center;font-size:11px;cursor:pointer}
.th canvas{display:block;border-radius:8px;border:2px solid transparent}
.th .on canvas{border-color:var(--ac)}

label.c{display:flex;align-items:center;gap:6px;font-size:13px}
