<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0084ff;--m:#0084ff;--bg:#ffffff;--s:#f0f2f5;--t:#050505;--t2:#65676b;--o:#e4e6eb;--b:#dddfe2;
  --radius:14px;--shadow:0 2px 12px #0001;
  --font:'Inter','Noto Sans',system-ui,sans-serif
}
[data-t=green]{--p:#1a9f4e;--m:#1a9f4e;--o:#e3f5ea;--s:#f0faf3}
[data-t=purple]{--p:#7c3aed;--m:#7c3aed;--o:#ede9fe;--s:#f5f3ff}
[data-t=pink]{--p:#e91e8c;--m:#e91e8c;--s:#fdf0f6;--o:#fce4f3}
[data-t=sepia]{--p:#a0703c;--m:#a0703c;--bg:#faf6ef;--s:#f0e8d6;--o:#e5d5b8;--t:#2c1f0e;--t2:#7a6a50;--b:#d6c8a6}
[data-t=dark]{
  --p:#2d88ff;--m:#2d88ff;--bg:#0f1117;--s:#1a1d27;--t:#e8eaf0;--t2:#8b909e;--o:#252836;--b:#2a2d3a;
  --shadow:0 2px 12px #0004
}
[data-t=amoled]{
  --p:#00c6ff;--m:#00c6ff;--bg:#000000;--s:#0d0d0d;--t:#f0f0f0;--t2:#777;--o:#181818;--b:#222;
  --shadow:0 2px 12px #0008
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 var(--font);background:var(--bg);color:var(--t);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;transition:background .15s,opacity .15s}
button{cursor:pointer;border:0;background:var(--s);padding:8px 14px;border-radius:10px;font-weight:500;letter-spacing:.01em}
button:disabled{opacity:.45;cursor:not-allowed}
button:active{opacity:.8}
button.pr{background:var(--p);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--p) 35%,transparent)}
button.pr:hover{filter:brightness(1.08)}
input,textarea{background:var(--s);border:1.5px solid var(--b);border-radius:12px;padding:10px 15px;outline:0;width:100%;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--p)}
a{color:var(--p);text-decoration:none}
#app{display:grid;grid-template-columns:320px 1fr;height:100dvh}
#side{border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--b);background:var(--bg);backdrop-filter:blur(10px)}
.hd h2{flex:1;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.tabs{display:flex;gap:5px;padding:10px 10px 6px}
.tabs button{flex:1;border-radius:12px;font-size:13px;padding:8px 4px;font-weight:500;background:transparent;color:var(--t2)}
.tabs .on{background:var(--p);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--p) 30%,transparent)}
.lst{flex:1;overflow:auto;padding:4px 8px 8px}
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .12s}
.it:hover{background:var(--s)}
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none;margin-left:auto;box-shadow:0 0 0 2px var(--bg)}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:7px;align-items:flex-end;max-width:80%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.col{display:flex;flex-direction:column;min-width:0;gap:2px}
.row.me .col{align-items:flex-end}
.bub{background:var(--o);border-radius:18px 18px 18px 4px;padding:9px 13px;max-width:100%;overflow-wrap:anywhere;word-break:break-word;font-size:15px;line-height:1.45;box-shadow:var(--shadow)}
.me .bub{background:var(--m);color:#fff;border-radius:18px 18px 4px 18px}
.tx{white-space:pre-wrap}
.med img,.med video{max-width:min(280px,100%);border-radius:12px;display:block;cursor:pointer}
.file{color:inherit;font-weight:600;text-decoration:none;opacity:.9}
small{color:var(--t2);font-size:11px;letter-spacing:.01em}
.cmp{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--b);align-items:flex-end;background:var(--bg)}
.cmp textarea{resize:none;max-height:120px;border-radius:14px;font-size:15px;line-height:1.45}
.delbtn{background:none;padding:0 5px;color:var(--t2);opacity:0;align-self:center;font-size:14px}
.row:hover .delbtn{opacity:.7}
.more{align-self:center;font-size:13px;padding:6px 16px;margin:4px 0;border-radius:20px}
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:center;justify-content:center;z-index:9;backdrop-filter:blur(3px)}
.md{background:var(--bg);border-radius:18px;padding:20px;width:min(430px,94vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 40px #0003}
.mdhd{display:flex;align-items:center;border-bottom:1px solid var(--b);padding-bottom:12px;margin-bottom:2px}
.mdhd h3{flex:1;font-size:17px;font-weight:600}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--t) 90%,transparent);color:var(--bg);padding:10px 20px;border-radius:24px;display:none;z-index:99;max-width:88vw;font-size:14px;font-weight:500;box-shadow:0 4px 20px #0003}
.auth{max-width:380px;margin:8vh auto;padding:28px 24px;display:flex;flex-direction:column;gap:14px;text-align:center}
.auth h1{font-size:32px;font-weight:700;color:var(--p);letter-spacing:-.02em}
.auth .sub{color:var(--t2);font-size:14px;margin-top:-6px}
.sw{width:40px;height:40px;border-radius:12px;padding:0;border:2.5px solid transparent;transition:border-color .15s,transform .1s}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--t);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
.theme-name{font-size:11px;color:var(--t2);text-align:center;margin-top:2px;font-weight:500}
.bk{display:none}
.itinfo{flex:1;min-width:0}
.itinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.itinfo small{font-size:12px}
.rmv{background:none;padding:4px 7px;color:var(--t2);font-size:16px;opacity:.6;flex:none;border-radius:8px}
.rmv:hover{opacity:1;color:#e53935;background:color-mix(in srgb,#e53935 10%,transparent)}
.secdiv{border:none;border-top:1px solid var(--b);margin:4px 0}
@media(max-width:700px){
  #app{grid-template-columns:1fr}
  .co #side{display:none}
  #app:not(.co) #main{display:none}
  .bk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;font-size:18px;border-radius:10px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════ */
const SB = supabase.createClient(
  'https://whxbagdfezrxxppgwvgw.supabase.co',
  'sb_publishable_61oKDS-FK2KuyXUXtbrf9g_jBu_SO54'
);
const MAXF = 50 * 1048576; // 50 MB

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let me, cur, CH=[], F=[], U={}, view='chats', MSG=[], more=false, P={};
try { P = JSON.parse(localStorage.getItem('P') || '{}') } catch {}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const em = u => u.toLowerCase() + '@chatapp.local';
const sz = n => n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const tm = x => new Date(x).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const theme = t => { document.documentElement.dataset.t = t; localStorage.setItem('t', t) };

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (k === 'on') for (const ev in v) e.addEventListener(ev, v[ev]);
    else if (k === 'c') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c) e.append(c);
  return e;
}

const toast = msg => {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 3500);
};

const av = (p, s=40) => el('div', {c:'av', style:`background:${p.avatar_color||'#888'};width:${s}px;height:${s}px;font-size:${Math.round(s/2.4)}px`}, p.avatar_letter||'?');
const gav = (c, s=40) => av({avatar_letter:(c.name||'G')[0].toUpperCase(), avatar_color: c.type==='public_group'?'#43a047':'#5e35b1'}, s);
const cname = c => c.type==='dm' ? (P[c.peer]?.username || 'Chat') : c.name;

function modal(title, ...kids) {
  const o = el('div', {c:'ov', on:{click:e=>e.target===o&&o.remove()}},
    el('div', {c:'md'},
      el('div', {c:'mdhd'}, el('h3',{},title), el('button',{on:{click:()=>o.remove()}},'✕')),
      ...kids));
  document.body.append(o);
  return o;
}

/* ═══════════════════════════════════════════════════
   NOTIFICATIONS
═══════════════════════════════════════════════════ */
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}
function pushNotif(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, {body, icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><circle cx=%2220%22 cy=%2220%22 r=%2220%22 fill=%22%230084ff%22/><text x=%2250%25%22 y=%2256%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2222%22>C</text></svg>'}) } catch {}
}

/* ═══════════════════════════════════════════════════
   INDEXEDDB CACHE
═══════════════════════════════════════════════════ */
const DB = new Promise(res => {
  try {
    const r = indexedDB.open('chat2', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('c');
    r.onsuccess = () => res(r.result);
    r.onerror   = () => res(null);
  } catch { res(null) }
});
const idb = async (mode, fn) => {
  const db = await DB; if (!db) return;
  return new Promise(res => {
    try { const q = fn(db.transaction('c', mode).objectStore('c')); q.onsuccess=()=>res(q.result); q.onerror=()=>res() } catch { res() }
  });
};
const cget  = k    => idb('readonly',  s => s.get(k));
const cset  = (k,v)=> idb('readwrite', s => s.put(v, k));
const cdel  = k    => idb('readwrite', s => s.delete(k));
const ckeys = ()   => idb('readonly',  s => s.getAllKeys());
const ck    = id   => me.id + ':' + id;
const cput  = ()   => cur && cset(ck(cur.id), MSG.slice(-500));

async function wipe() {
  const db = await DB; if (db) db.close();
  localStorage.removeItem('P');
  await new Promise(res => { try { const r=indexedDB.deleteDatabase('chat2'); r.onsuccess=r.onerror=r.onblocked=()=>res() } catch { res() } });
}

/* ═══════════════════════════════════════════════════
   PROFILE CACHE
═══════════════════════════════════════════════════ */
async function need(ids) {
  ids = [...new Set(ids)].filter(i => i && !P[i]);
  if (!ids.length) return;
  const {data} = await SB.from('profiles').select('id,username,avatar_letter,avatar_color').in('id', ids);
  (data||[]).forEach(p => P[p.id] = p);
  // keep cache ≤200 entries
  const keys = Object.keys(P);
  if (keys.length > 200) {
    const keep = new Set([me?.id, ...F.map(f => f.requester_id===me?.id ? f.addressee_id : f.requester_id)]);
    keys.filter(k => !keep.has(k)).slice(0, keys.length-200).forEach(k => delete P[k]);
  }
  try { localStorage.setItem('P', JSON.stringify(P)) } catch {}
}

/* ═══════════════════════════════════════════════════
   DEVICE / FINGERPRINT
═══════════════════════════════════════════════════ */
const did = () => { let d=localStorage.getItem('d'); if(!d){d=crypto.randomUUID();localStorage.setItem('d',d)} return d };
async function fp() {
  const t = [navigator.userAgent, navigator.language, screen.width+'x'+screen.height+'x'+screen.colorDepth,
             Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, navigator.platform].join('|');
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(h)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ═══════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════ */
function authUI() {
  let mode = 'in';
  const root = $('#root'); root.replaceChildren();
  const uI  = el('input',  {placeholder:'Username (3–20 chars)', autocapitalize:'off', maxLength:20});
  const pI  = el('input',  {type:'password', placeholder:'Password (min 6 chars)'});
  const err = el('small',  {style:'color:#e53935;min-height:18px'});
  const btn = el('button', {c:'pr', on:{click:go}}, 'Log in');
  const sw  = el('a', {href:'#', on:{click:e=>{
    e.preventDefault(); mode = mode==='in'?'up':'in';
    btn.textContent = mode==='in'?'Log in':'Create account';
    sw.textContent  = mode==='in'?'No account? Sign up':'Already have an account? Log in';
  }}}, 'No account? Sign up');

  async function go() {
    err.textContent = '';
    const n = uI.value.trim(), pw = pI.value;
    if (!/^[A-Za-z][A-Za-z0-9_]{2,19}$/.test(n)) { err.textContent='Username: 3–20 chars, start with a letter, only letters/numbers/_'; return }
    if (pw.length < 6) { err.textContent='Password must be at least 6 characters'; return }
    btn.disabled = true;

    try {
      const D = did(), day = new Date().toISOString().slice(0,10);
      const dayKey = 'fl:'+D+':'+n.toLowerCase()+':'+day;

      if (mode === 'in') {
        // client-side lockout check
        if (parseInt(localStorage.getItem(dayKey)||'0') >= 5) {
          err.textContent = 'Too many failed attempts on this device. Try again tomorrow.';
          btn.disabled = false; return;
        }
        // server-side lockout check
        const {data:allowed} = await SB.rpc('check_login_allowed', {p_username:n, p_device:D});
        if (allowed === false) {
          err.textContent = 'Too many failed attempts. Locked out for today.';
          btn.disabled = false; return;
        }
        const {data, error} = await SB.auth.signInWithPassword({email:em(n), password:pw});
        if (error) {
          // increment both client and server fail counters
          const fails = parseInt(localStorage.getItem(dayKey)||'0') + 1;
          localStorage.setItem(dayKey, fails);
          await SB.rpc('record_login_fail', {p_username:n, p_device:D});
          err.textContent = error.message.includes('Invalid')
            ? `Wrong password. ${5-fails} attempt(s) left today.` : error.message;
          btn.disabled = false; return;
        }
        // success — clear counters
        localStorage.removeItem(dayKey);
        await SB.rpc('record_login_success', {p_username:n, p_device:D});
        await start(data.user);

      } else {
        const {data:ok} = await SB.rpc('username_available', {uname:n});
        if (!ok) { err.textContent='Username already taken'; btn.disabled=false; return }
        const X = await fp();
        const {data:al} = await SB.rpc('signup_allowed', {p_did:D, p_fp:X});
        if (!al) { err.textContent='This device already created 2 accounts in 24 hours. Try later.'; btn.disabled=false; return }
        const {error} = await SB.auth.signUp({email:em(n), password:pw, options:{data:{username:n,device_id:D,fp:X}}});
        if (error) throw error;
        err.textContent = ''; err.style.color='#43a047';
        err.textContent = 'Account created! Logging in…';
        await new Promise(r=>setTimeout(r,800));
        const {data, error:e2} = await SB.auth.signInWithPassword({email:em(n), password:pw});
        if (e2) throw e2;
        await start(data.user);
      }
    } catch(e) { err.textContent = e.message }
    btn.disabled = false;
  }
  pI.addEventListener('keydown', e => e.key==='Enter' && go());
  root.append(el('div', {c:'auth'},
    el('h1',{}, '💬 Chat'),
    el('p',{c:'sub'}, 'Messages auto-delete after 30 days'),
    uI, pI, err, btn, sw));
}

async function boot() {
  const {data:{session}} = await SB.auth.getSession();
  session ? start(session.user) : authUI();
}

async function start(user) {
  const {data} = await SB.from('profiles').select('*').eq('id', user.id).single();
  if (!data) { await SB.auth.signOut(); return authUI() }
  me = data; P[me.id] = me;
  const t = me.theme || localStorage.getItem('t') || 'blue';
  theme(t); localStorage.setItem('t', t);
  shell();
  await Promise.all([loadChats(), loadFriends()]);

  // ── Realtime ──
  SB.channel('rt')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, async p => {
      const m = p.new;
      await need([m.sender_id]);
      if (cur && m.conversation_id === cur.id) {
        addMsg(m);
      } else {
        U[m.conversation_id] = 1;
        // cache update
        const a = await cget(ck(m.conversation_id));
        if (a && !a.some(x=>x.id===m.id)) { a.push(m); cset(ck(m.conversation_id), a.slice(-500)) }
        // push notification
        const sender = P[m.sender_id] || {};
        const conv = CH.find(c=>c.id===m.conversation_id);
        const title = conv ? (conv.type==='dm' ? (sender.username||'Someone') : (conv.name+' — '+(sender.username||'?'))) : 'New message';
        pushNotif(title, m.body || '📎 File');
        // move chat to top
        if (CH.some(c=>c.id===m.conversation_id)) {
          const idx = CH.findIndex(c=>c.id===m.conversation_id);
          if (idx > 0) { const [c]=CH.splice(idx,1); c.last_msg_at=m.created_at; CH.unshift(c); cset('CH:'+me.id, CH) }
          if (view==='chats') renderChats();
        } else loadChats();
      }
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, p => gone(p.old.id))
    .on('postgres_changes', {event:'*', schema:'public', table:'friendships'}, () => loadFriends())
    .on('postgres_changes', {event:'*', schema:'public', table:'conversation_members'}, () => loadChats())
    .subscribe();
}

/* ═══════════════════════════════════════════════════
   SHELL
═══════════════════════════════════════════════════ */
function shell() {
  $('#root').replaceChildren(
    el('div', {id:'app'},
      el('div', {id:'side'},
        el('div', {c:'hd'}, av(me,36), el('h2',{},'Chats'), el('button',{title:'Settings',on:{click:settings}},'⚙')),
        el('div', {c:'tabs', id:'tabs'}),
        el('div', {c:'lst',  id:'lst'})),
      el('div', {id:'main'},
        el('div', {style:'margin:auto;text-align:center;padding:24px;color:var(--t2)'},
          el('div',{style:'font-size:48px'},'💬'),
          el('p',{},'Select a chat'), el('br'),
          el('small',{},'Messages vanish after 30 days')))));
  tabs();
}

function tabs() {
  const t = $('#tabs'); if (!t) return;
  const pend = F.some(f => f.status==='pending' && f.addressee_id===me.id);
  t.replaceChildren(...[['chats','Chats'],['friends','Friends'],['groups','Groups']].map(([k,l]) =>
    el('button', {c:view===k?'on':'', on:{click:()=>{view=k;tabs()}}}, l+(k==='friends'&&pend?' •':''))));
  render();
}

function render() { ({chats:renderChats, friends:renderFriends, groups:renderGroups})[view]() }

/* ═══════════════════════════════════════════════════
   CHAT LIST
═══════════════════════════════════════════════════ */
async function loadChats() {
  // show cache immediately
  if (!CH.length) { const a = await cget('CH:'+me.id); if (a) { CH=a; if(view!=='friends') render() } }
  const {data, error} = await SB.from('conversation_members')
    .select('conversations(id,type,name,creator_id,last_msg_at)')
    .eq('user_id', me.id);
  if (error) return;
  CH = (data||[]).map(x=>x.conversations).filter(Boolean);
  // resolve DM peer
  const dmIds = CH.filter(c=>c.type==='dm').map(c=>c.id);
  if (dmIds.length) {
    const {data:o} = await SB.from('conversation_members').select('conversation_id,user_id').in('conversation_id',dmIds).neq('user_id',me.id);
    await need((o||[]).map(x=>x.user_id));
    (o||[]).forEach(x=>{const c=CH.find(c=>c.id===x.conversation_id);if(c)c.peer=x.user_id});
  }
  // sort newest first
  CH.sort((a,b) => (b.last_msg_at||b.id||0) > (a.last_msg_at||a.id||0) ? 1 : -1);
  cset('CH:'+me.id, CH);
  // remove stale cache
  ((await ckeys())||[]).filter(k=>k.startsWith(me.id+':')&&!CH.some(c=>ck(c.id)===k)).forEach(cdel);
  if (cur && !CH.some(c=>c.id===cur.id)) { cur=null; MSG=[]; $('#app').classList.remove('co'); $('#main').replaceChildren() }
  if (view!=='friends') render();
}

function renderChats() {
  const l = $('#lst'); if (!l) return;
  if (!CH.length) { l.replaceChildren(el('p',{style:'padding:16px;color:var(--t2)'},'No chats yet. Add friends to start.')); return }
  l.replaceChildren(...CH.map(c => {
    const dm = c.type==='dm';
    const row = el('div', {c:'it'},
      dm ? av(P[c.peer]||{}) : gav(c),
      el('div', {c:'itinfo'},
        el('b',{}, cname(c)),
        el('small',{}, dm?'Direct message':c.type==='public_group'?'Public group':'Private group')),
      U[c.id] ? el('i',{c:'dot'}) : null,
      el('button', {c:'rmv', title:dm?'Remove chat':'Leave group',
        on:{click:e=>{e.stopPropagation(); dm?removeDM(c):leaveGroupById(c)}}}, dm?'✕':'🚪'));
    row.addEventListener('click', () => openChat(c));
    return row;
  }));
}

/* ═══════════════════════════════════════════════════
   FRIENDS
═══════════════════════════════════════════════════ */
async function loadFriends() {
  const {data} = await SB.from('friendships').select('*');
  F = data||[];
  await need(F.map(f => f.requester_id===me.id ? f.addressee_id : f.requester_id));
  tabs();
}

function renderFriends() {
  const l = $('#lst'); if (!l) return;
  const oth = f => f.requester_id===me.id ? f.addressee_id : f.requester_id;
  const rs = el('div');
  const qi = el('input', {placeholder:'Search username, press Enter'});
  qi.addEventListener('keydown', async e => {
    if (e.key!=='Enter' || !e.target.value.trim()) return;
    const {data,error} = await SB.rpc('search_users', {q:e.target.value.trim()});
    if (error) return toast(error.message);
    rs.replaceChildren(...(data||[]).map(p => {
      P[p.id] = P[p.id]||p;
      const r=el('div',{c:'it'},av(p,36),el('div',{c:'itinfo'},el('b',{},p.username)),
        el('button',{c:'pr',on:{click:()=>addFriend(p.id)}},'Add'));
      r.style.cursor='default'; return r;
    }));
    if (!data?.length) rs.textContent='No users found';
  });

  const inc = F.filter(f=>f.status==='pending'&&f.addressee_id===me.id);
  const out = F.filter(f=>f.status==='pending'&&f.requester_id===me.id);
  const fr  = F.filter(f=>f.status==='accepted');

  const frow = (f, ...btns) => {
    const p = P[oth(f)]||{};
    return el('div',{c:'it',style:'cursor:default'}, av(p,36), el('div',{c:'itinfo'},el('b',{},p.username)), ...btns);
  };
  const rmBtn = f => el('button',{on:{click:async()=>{await SB.from('friendships').delete().eq('id',f.id);loadFriends();}}},'✕');

  l.replaceChildren(
    el('div',{style:'padding:8px'},qi,rs),
    ...(inc.length?[el('b',{style:'padding:8px;display:block'},'Requests ('+inc.length+')')]:[] ),
    ...inc.map(f=>frow(f,
      el('button',{c:'pr',on:{click:async()=>{await SB.from('friendships').update({status:'accepted'}).eq('id',f.id);loadFriends()}}},'Accept'),
      rmBtn(f))),
    ...(out.length?[el('b',{style:'padding:8px;display:block'},'Sent')]:[] ),
    ...out.map(f=>frow(f, el('small',{},'Pending'), rmBtn(f))),
    el('b',{style:'padding:8px;display:block'},'Friends ('+fr.length+')'),
    ...fr.map(f=>{
      const p=P[oth(f)]||{};
      const r=frow(f,
        el('button',{on:{click:async()=>{
          if(!confirm('Unfriend '+p.username+'? Your DM will also be deleted for both.'))return;
          const{error}=await SB.rpc('unfriend',{other:p.id});
          if(error)return toast(error.message);
          await loadFriends(); loadChats();
        }}},'Unfriend'));
      r.style.cursor='pointer';
      r.onclick=e=>{if(!e.target.closest('button'))openDM(p.id)};
      return r;
    }));
}

async function addFriend(id) {
  const{error}=await SB.from('friendships').insert({requester_id:me.id,addressee_id:id});
  toast(error?(error.code==='23505'?'Already requested':error.message):'Friend request sent!');
  loadFriends();
}

async function openDM(id) {
  const{data,error}=await SB.rpc('get_or_create_dm',{other:id});
  if(error)return toast(error.message);
  await loadChats();
  openChat(CH.find(c=>c.id===data));
}

/* ═══════════════════════════════════════════════════
   GROUPS
═══════════════════════════════════════════════════ */
function renderGroups() {
  const l = $('#lst'); if (!l) return;
  const sr = el('div');
  const qi = el('input', {placeholder:'Search public groups by name…'});
  const sb = el('button', {c:'pr', on:{click:doSearch}}, 'Search');
  async function doSearch() {
    const v = qi.value.trim(); if(!v) return;
    const{data}=await SB.from('conversations').select('id,type,name,creator_id,last_msg_at')
      .eq('type','public_group').ilike('name','%'+v+'%').order('last_msg_at',{ascending:false}).limit(30);
    sr.replaceChildren(...(data||[]).map(c=>el('div',{c:'it',on:{click:()=>joinOpen(c)}},
      gav(c), el('div',{c:'itinfo'},el('b',{},c.name)), el('small',{},CH.some(x=>x.id===c.id)?'✓ Joined':'Join'))));
    if(!data?.length) sr.textContent='No groups found';
  }
  qi.addEventListener('keydown', e=>e.key==='Enter'&&doSearch());
  l.replaceChildren(
    el('div',{style:'padding:8px;display:flex;flex-direction:column;gap:10px'},
      el('b',{style:'font-size:15px'},'🔍 Find Groups'),
      el('div',{style:'display:flex;gap:6px'},qi,sb),
      sr,
      el('hr',{style:'border:none;border-top:1px solid var(--b)'}),
      el('b',{style:'font-size:15px'},'➕ Create Group'),
      el('button',{c:'pr',on:{click:createGroupModal}},'New Group')));
}

async function joinOpen(c) {
  if (!CH.some(x=>x.id===c.id)) {
    const{error}=await SB.rpc('join_public_group',{cid:c.id});
    if(error)return toast(error.message);
    await loadChats();
  }
  openChat(CH.find(x=>x.id===c.id)||c);
}

function createGroupModal() {
  const nm = el('input',{placeholder:'Group name',maxLength:60});
  const pub = el('input',{type:'checkbox',style:'width:auto'});
  const mk  = el('button',{c:'pr',on:{click:async()=>{
    if(!nm.value.trim())return;
    const{data,error}=await SB.rpc('create_group',{gname:nm.value.trim(),is_public:pub.checked});
    if(error)return toast(error.message);
    o.remove(); await loadChats(); openChat(CH.find(c=>c.id===data));
  }}},'Create');
  const o=modal('Create Group', nm, el('label',{style:'display:flex;gap:8px;align-items:center'},pub,' Public (searchable by everyone)'), mk);
}

/* ═══════════════════════════════════════════════════
   OPEN CHAT
═══════════════════════════════════════════════════ */
async function openChat(c) {
  if (!c) return;
  cur=c; MSG=[]; more=false; U[c.id]=0;
  $('#app').classList.add('co');
  const dm = c.type==='dm';

  $('#main').replaceChildren(
    el('div',{c:'hd'},
      el('button',{c:'bk',on:{click:()=>{cur=null;$('#app').classList.remove('co')}}},'←'),
      dm ? av(P[c.peer]||{},36) : gav(c,36),
      el('h2',{style:'font-size:16px'},cname(c)),
      dm ? el('button',{c:'rmv',title:'Remove chat',on:{click:()=>removeDM(c)}},'✕')
         : el('button',{c:'rmv',title:'Group info',on:{click:groupInfo}},'ⓘ'),
      !dm && el('button',{title:'Leave group',style:'background:none;padding:4px 8px;color:#e53935',on:{click:()=>leaveGroup(c)}},'Leave')),
    el('div',{id:'msgs'}),
    el('small',{id:'st',style:'padding:0 14px;color:var(--t2)'}),
    el('div',{c:'cmp'},
      el('button',{title:'Attach file',on:{click:()=>$('#fi').click()}},'📎'),
      el('input',{id:'fi',type:'file',multiple:true,style:'display:none',on:{change:e=>{[...e.target.files].forEach(f=>upFile(f));e.target.value=''}}}),
      el('textarea',{id:'ta',rows:1,placeholder:'Type a message…',on:{
        input:e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'},
        keydown:e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}}
      }}),
      el('button',{c:'pr',on:{click:send}},'Send')));

  if (view==='chats') renderChats();

  // load cache first (instant)
  const cache = (await cget(ck(c.id)))||[];
  await need(cache.map(m=>m.sender_id)); if(cur!==c) return;
  MSG = cache.slice(-40); draw(true);

  // then fetch server
  const{data,error}=await SB.from('messages').select('*').eq('conversation_id',c.id).order('id',{ascending:false}).limit(40);
  if(error){toast('Offline — showing cached messages');return}
  const sv=data.reverse(); await need(sv.map(m=>m.sender_id)); if(cur!==c) return;
  more = sv.length===40;
  MSG = sv; if(sv.length<40&&cache.length) MSG=[...cache.filter(m=>!sv.some(x=>x.id===m.id&&m.id<sv[0]?.id)),...sv];
  MSG = [...new Map(MSG.map(m=>[m.id,m])).values()].sort((a,b)=>a.id-b.id);
  draw(true); cput();

  // infinite scroll up
  const msgsEl=$('#msgs');
  msgsEl.addEventListener('scroll', async()=>{
    if(msgsEl.scrollTop<80&&more&&!msgsEl._loading){msgsEl._loading=true;await older();msgsEl._loading=false}
  });
}

function draw(bottom) {
  const b=$('#msgs'); if(!b) return;
  b.replaceChildren(...(more?[el('button',{c:'more',on:{click:older}},'↑ Load older messages')]:[]));
  MSG.forEach(m=>paint(m,true));
  if(bottom) b.scrollTop=b.scrollHeight;
}

async function older() {
  const c=cur,b=$('#msgs'),first=MSG[0]?.id; if(!first) return;
  const{data,error}=await SB.from('messages').select('*').eq('conversation_id',c.id).lt('id',first).order('id',{ascending:false}).limit(40);
  if(error||cur!==c) return;
  const o=data.reverse(); await need(o.map(m=>m.sender_id)); if(cur!==c) return;
  more=data.length===40;
  const h=b.scrollHeight;
  MSG=[...o,...MSG];
  if(MSG.length>200) MSG=MSG.slice(MSG.length-200); // keep RAM low
  draw(false); b.scrollTop=b.scrollHeight-h; cput();
}

const gone = id => { MSG=MSG.filter(x=>x.id!==id); cput(); document.getElementById('m'+id)?.remove() };

function addMsg(m) {
  if(!MSG.some(x=>x.id===m.id)){MSG.push(m);cput()}
  paint(m,false);
  // move to top of list
  const idx=CH.findIndex(x=>x.id===m.conversation_id);
  if(idx>0){const[cv]=CH.splice(idx,1);cv.last_msg_at=m.created_at;CH.unshift(cv);cset('CH:'+me.id,CH)}
  if(view==='chats') renderChats();
}

function paint(m, quiet) {
  const b=$('#msgs'); if(!b||document.getElementById('m'+m.id)) return;
  const mine=m.sender_id===me.id, s=P[m.sender_id]||{};
  const near=b.scrollHeight-b.scrollTop-b.clientHeight<160;
  const bub=el('div',{c:'bub'});

  if(m.file_path){
    if(m.kind==='image'||m.kind==='video'){
      const w=el('div',{c:'med'},'Loading…'); bub.append(w);
      getUrl(m).then(u=>{w.textContent='';if(u)w.append(m.kind==='image'?el('img',{src:u,on:{click:()=>window.open(u)}}):el('video',{src:u,controls:true,preload:'metadata'}))});
    }
    bub.append(el('a',{href:'#',c:'file',on:{click:e=>{e.preventDefault();dlFile(m)}}}, (m.kind==='image'||m.kind==='video'?'⬇ ':'📄 ')+m.file_name+' ('+sz(m.file_size||0)+')'));
  }
  if(m.body) bub.append(el('div',{c:'tx'},m.body));

  b.append(el('div',{c:'row'+(mine?' me':''),id:'m'+m.id},
    mine?null:av(s,28),
    el('div',{c:'col'},
      !mine&&cur?.type!=='dm'&&el('small',{style:'font-weight:600;margin-bottom:2px'},s.username),
      bub,
      el('small',{},tm(m.created_at))),
    el('button',{c:'delbtn',title:'Delete',on:{click:()=>delMsg(m)}},'🗑')));

  if(!quiet&&(near||mine)) b.scrollTop=b.scrollHeight;
}

async function getUrl(m){const{data}=await SB.storage.from('chat-files').createSignedUrl(m.file_path,3600);return data?.signedUrl}
async function dlFile(m){const u=await getUrl(m);u?location.href=u:toast('File unavailable')}

function delMsg(m) {
  const o=modal('Delete message',
    el('button',{on:{click:async()=>{
      const{error}=await SB.from('message_hides').insert({user_id:me.id,message_id:m.id});
      if(error)return toast(error.message); gone(m.id);o.remove();
    }}},'Delete for me'),
    m.sender_id===me.id&&el('button',{style:'color:#e53935',on:{click:async()=>{
      const{error}=await SB.from('messages').delete().eq('id',m.id);
      if(error)return toast(error.message); gone(m.id);o.remove();
    }}},'Delete for everyone'));
}

async function send() {
  const ta=$('#ta'); if(!ta||!cur) return;
  const t=ta.value.trim(), c=cur; if(!t) return;
  ta.value=''; ta.style.height='auto';
  const{data,error}=await SB.from('messages').insert({conversation_id:c.id,sender_id:me.id,body:t}).select().single();
  if(error){ta.value=t;return toast(error.message)}
  if(cur===c) addMsg(data);
}

async function upFile(f) {
  if(!cur) return;
  const c=cur,st=$('#st');
  if(f.size>MAXF) return toast(f.name+': too large (max 50 MB)');
  st.textContent='Uploading '+f.name+'…';
  const path=`${c.id}/${me.id}/${crypto.randomUUID()}`;
  const{error}=await SB.storage.from('chat-files').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(error){toast(error.message);st.textContent='';return}
  const k=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'file';
  const r=await SB.from('messages').insert({conversation_id:c.id,sender_id:me.id,kind:k,file_path:path,file_name:f.name,file_size:f.size,file_mime:f.type}).select().single();
  if(r.error) toast(r.error.message); else if(cur===c) addMsg(r.data);
  st.textContent='';
}

/* ═══════════════════════════════════════════════════
   REMOVE / LEAVE
═══════════════════════════════════════════════════ */
async function removeDM(c) {
  if(!confirm('Remove this chat? Friendship stays. Re-open from Friends tab.')) return;
  CH=CH.filter(x=>x.id!==c.id); cset('CH:'+me.id,CH); cdel(ck(c.id)); delete U[c.id];
  if(cur&&cur.id===c.id){cur=null;MSG=[];$('#app').classList.remove('co');$('#main').replaceChildren()}
  renderChats();
  SB.from('conversation_members').delete().eq('conversation_id',c.id).eq('user_id',me.id);
}

async function leaveGroup(c) {
  c=c||cur; if(!c||c.type==='dm') return;
  if(!confirm('Leave "'+c.name+'"?')) return;
  const{error}=await SB.rpc('leave_group',{cid:c.id});
  if(error) return toast(error.message);
  CH=CH.filter(x=>x.id!==c.id); cset('CH:'+me.id,CH); cdel(ck(c.id)); delete U[c.id];
  if(cur&&cur.id===c.id){cur=null;MSG=[];$('#app').classList.remove('co');$('#main').replaceChildren()}
  renderChats();
}

async function leaveGroupById(c) { await leaveGroup(c) }

/* ═══════════════════════════════════════════════════
   GROUP INFO
═══════════════════════════════════════════════════ */
async function groupInfo() {
  const c=cur;
  const{data}=await SB.from('conversation_members').select('user_id').eq('conversation_id',c.id);
  const ids=(data||[]).map(x=>x.user_id); await need(ids);
  const o=modal(c.name+' ('+ids.length+' members)');
  const box=o.querySelector('.md');
  const ai=el('input',{placeholder:'Add member by exact username'});
  box.append(
    el('div',{style:'display:flex;gap:6px'},ai,
      el('button',{c:'pr',on:{click:async()=>{
        const v=ai.value.trim();
        const{data:r}=await SB.rpc('search_users',{q:v});
        const u=(r||[]).find(x=>x.username.toLowerCase()===v.toLowerCase());
        if(!u) return toast('User not found');
        const{error}=await SB.rpc('add_member',{cid:c.id,uid:u.id});
        if(error) return toast(error.message);
        toast('Added '+u.username); o.remove(); groupInfo();
      }}},'Add')),
    el('button',{style:'background:var(--s);color:#e53935',on:{click:async()=>{
      if(!confirm('Clear all messages for yourself?')) return;
      const{error}=await SB.rpc('delete_all_for_me',{cid:c.id});
      if(error) return toast(error.message);
      MSG=[]; draw(true); cput(); toast('Cleared'); o.remove();
    }}},'🗑 Clear chat history (for me)'),
    ...ids.map(uid=>{
      const p=P[uid]||{};
      return el('div',{c:'it',style:'cursor:default'},av(p,32),
        el('div',{c:'itinfo'},el('b',{},p.username+(uid===c.creator_id?' 👑':''))),
        uid!==me.id&&el('button',{on:{click:async()=>{
          if(!confirm('Report '+p.username+'?')) return;
          const{error}=await SB.rpc('report_user',{cid:c.id,target:uid});
          toast(error?error.message:'Reported');
        }}},'Report'));
    }),
    el('button',{style:'color:#e53935',on:{click:()=>{leaveGroup(c);o.remove()}}},'🚪 Leave group'));
}

/* ═══════════════════════════════════════════════════
   SETTINGS
═══════════════════════════════════════════════════ */
async function applyTheme(t) {
  theme(t);
  me.theme = t;
  await SB.from('profiles').update({theme:t}).eq('id',me.id);
}

function settings() {
  const themes=[
    ['blue','#0084ff','Blue'],['green','#1a9f4e','Green'],['purple','#7c3aed','Purple'],
    ['pink','#e91e8c','Pink'],['sepia','#a0703c','Sepia'],['dark','#1a1d27','Dark'],
    ['amoled','#000000','AMOLED']
  ];
  const cur_t = document.documentElement.dataset.t || 'blue';
  const wrap = el('div',{style:'display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 0'});
  themes.forEach(([t,c,label])=>{
    const btn=el('button',{c:'sw'+(cur_t===t?' on':''),title:label,
      style:'background:'+c+';width:100%;height:40px',
      on:{click:async()=>{
        wrap.querySelectorAll('.sw').forEach(b=>b.classList.remove('on'));
        btn.classList.add('on');
        await applyTheme(t);
        toast('Theme: '+label);
      }}});
    wrap.append(el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:4px'},btn,el('span',{c:'theme-name'},label)));
  });
  modal('Settings',
    el('p',{style:'font-weight:600;font-size:14px;color:var(--t2);letter-spacing:.04em'},'THEME'),
    wrap,
    el('hr',{c:'secdiv'}),
    el('div',{style:'background:var(--s);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px'},
      el('b',{style:'font-size:15px'},'@'+me.username),
      el('small',{style:'color:var(--t2)'},'Account auto-deletes after 2 years of inactivity')),
    el('button',{style:'font-weight:500',on:{click:async()=>{await SB.auth.signOut();await wipe();location.reload()}}},'Log out'),
    el('button',{style:'color:#e53935;font-weight:500',on:{click:async()=>{
      if(!confirm('Delete your account forever? This cannot be undone.')) return;
      const{error}=await SB.rpc('delete_my_account');
      if(error) return toast(error.message);
      await SB.auth.signOut(); await wipe(); location.reload();
    }}},'Delete account'));
}

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
theme(localStorage.getItem('t')||'blue');
boot();
</script>
