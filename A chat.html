<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box;margin:0}
body{font:15px system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);height:100dvh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--s);padding:8px 12px;border-radius:8px}

input,textarea{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:9px 14px;outline:0;width:100%}
a{color:var(--p)}
#app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
#side{border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0}

.tabs .on{background:var(--p);color:#fff}
.lst{flex:1;overflow:auto;padding:4px 8px}
.it{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}

.dot{width:10px;height:10px;border-radius:50%;background:var(--p);flex:none}

.row{display:flex;gap:6px;align-items:flex-end;max-width:82%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.col{display:flex;flex-direction:column;min-width:0}
.row.me .col{align-items:flex-end}
.bub{background:var(--o);border-radius:18px;padding:8px 12px;max-width:100%;overflow-wrap:anywhere}
.me .bub{background:var(--m);color:#fff}
.tx{white-space:pre-wrap}
.med img,.med video{max-width:min(320px,100%);border-radius:12px;display:block;cursor:pointer}
.file{color:inherit;font-weight:600}
small{color:var(--t2);font-size:11px}
.cmp{display:flex;gap:8px;padding:10px;border-top:1px solid var(--b);align-items:flex-end}
.cmp textarea{resize:none;max-height:120px}
.row .x{background:none;padding:0 4px;color:var(--t2);opacity:.6;align-self:center}
.more{align-self:center;font-size:13px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
.md{background:var(--bg);border-radius:14px;padding:16px;width:min(420px,92vw);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:99;max-width:90vw}
.auth{max-width:360px;margin:12vh auto;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.sw{width:34px;height:34px;border-radius:50%;padding:0}
.bk{display:none}
.search-bar{display:flex;gap:6px;padding:8px}
.search-bar input{flex:1}
@media(max-width:700px){#app{grid-template-columns:1fr}.co #side{display:none}#app:not(.co) #main{display:none}.bk{display:inline-block}}
</style></head>

function el(t,a,...k){const e=document.createElement(t);for(const x in a||{}){const v=a[x];if(x==='on')for(const n in v)e.addEventListener(n,v[n]);else if(x==='c')e.className=v;else if(x==='style')e.style.cssText=v;else if(x in e)e[x]=v;else e.setAttribute(x,v)}for(const c of k.flat())if(c)e.append(c);return e}

const cget=k=>idb('readonly',s=>s.get(k)),cset=(k,v)=>idb('readwrite',s=>s.put(v,k)),cdel=k=>idb('readwrite',s=>s.delete(k)),ckeys=()=>idb('readonly',s=>s.getAllKeys());

async function need(ids){ids=[...new Set(ids)].filter(i=>i&&!P[i]);if(!ids.length)return;const{data}=await SB.from('profiles').select('id,username,avatar_letter,avatar_color').in('id',ids);(data||[]).forEach(p=>P[p.id]=p);
 // keep profile cache lean: max 200 entries (keep me + friends + recent)
 const keys=Object.keys(P);if(keys.length>200){const keep=new Set([me?.id,...F.map(f=>f.requester_id===me?.id?f.addressee_id:f.requester_id)]);keys.filter(k=>!keep.has(k)).slice(0,keys.length-200).forEach(k=>delete P[k])}

/* ---------- device id ---------- */
const did=()=>{let d=localStorage.getItem('d');if(!d){d=crypto.randomUUID();localStorage.setItem('d',d)}return d};

/* ---------- auth ---------- */
function authUI(){let mode='in';const root=$('#root');root.replaceChildren();
 const u=el('input',{placeholder:'Username',autocapitalize:'off',maxLength:20}),p=el('input',{type:'password',placeholder:'Password (min 6)'}),err=el('small',{style:'color:#e53935'}),

  if(p.value.length<6){err.textContent='Password must be at least 6 characters';return}
  b.disabled=true;
  try{
   // --- login attempt rate limit: 5 tries per device per day ---
   if(mode==='in'){
    const D=did(),dayKey='fl:'+D+':'+n.toLowerCase()+':'+new Date().toISOString().slice(0,10);
    let fails=parseInt(localStorage.getItem(dayKey)||'0');
    if(fails>=5){err.textContent='Too many failed attempts on this device. Try again tomorrow.';b.disabled=false;return}
   }
   if(mode==='up'){const{data:ok}=await SB.rpc('username_available',{uname:n});if(!ok)throw Error('Username already taken');const D=did(),X=await fp(),{data:al}=await SB.rpc('signup_allowed',{p_did:D,p_fp:X});if(!al)throw Error('This device already created the maximum 2 accounts in 24 hours. Try again later.');
    const{error}=await SB.auth.signUp({email:em(n),password:p.value,options:{data:{username:n,device_id:D,fp:X}}});if(error)throw error}
   const{data,error}=await SB.auth.signInWithPassword({email:em(n),password:p.value});
   if(error){
    // increment fail counter
    const D=did(),dayKey='fl:'+D+':'+n.toLowerCase()+':'+new Date().toISOString().slice(0,10);
    let fails=parseInt(localStorage.getItem(dayKey)||'0')+1;
    localStorage.setItem(dayKey,fails);
    if(fails>=5)err.textContent='Too many failed attempts. This device is locked out for today.';
    else err.textContent=error.message.includes('Invalid')?`Wrong password. ${5-fails} attempt(s) left today.`:error.message;
    b.disabled=false;return}
   // clear fail counter on success
   const D=did(),dayKey='fl:'+D+':'+n.toLowerCase()+':'+new Date().toISOString().slice(0,10);
   localStorage.removeItem(dayKey);
   await start(data.user)}catch(e){err.textContent=e.message}

async function boot(){const{data:{session}}=await SB.auth.getSession();session?start(session.user):authUI()}
async function start(user){

 l.replaceChildren(...(CH.length?CH.map(c=>{const dm=c.type==='dm';return el('div',{c:'it',on:{click:()=>openChat(c)}},dm?av(P[c.peer]||{}):gav(c),

   el('input',{id:'fi',type:'file',multiple:true,style:'display:none',on:{change:e=>{[...e.target.files].forEach(f=>upFile(f));e.target.value=''}}}),
   el('textarea',{id:'ta',rows:1,placeholder:'Message',on:{keydown:e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}}}}),
   el('button',{c:'pr',on:{click:send}},'Send')));

 // --- virtual scroll / paginated load ---
 const msgsEl=$('#msgs');
 // Load latest 40 from cache first
 const cache=((await cget(ck(c.id)))||[]).filter(m=>new Date(m.expires_at)>Date.now());
 await need(cache.map(m=>m.sender_id));if(cur!==c)return;
 MSG=cache.slice(-40);draw(true);

 // Then fetch from server (40 messages)
 const{data,error}=await SB.from('messages').select('*').eq('conversation_id',c.id).order('id',{ascending:false}).limit(40);
 if(error)return toast('Offline: showing saved messages');
 const sv=data.reverse();await need(sv.map(m=>m.sender_id));if(cur!==c)return;
 const all=[...(sv.length<40?[]:cache.filter(m=>m.id<sv[0].id)),...sv];more=sv.length===40;
 const same=all.length===MSG.length&&all.every((m,i)=>m.id===MSG[i].id);
 MSG=all;if(!same||more)draw(!same);cput();

 // infinite scroll upward
 msgsEl.addEventListener('scroll',async()=>{if(msgsEl.scrollTop<80&&more&&!msgsEl._loading){msgsEl._loading=true;await older();msgsEl._loading=false}})}

function draw(bottom){const b=$('#msgs');if(!b)return;b.replaceChildren(...(more?[el('button',{c:'more',on:{click:older}},'Load older messages')]:[]));MSG.forEach(m=>paint(m,1));if(bottom)b.scrollTop=b.scrollHeight}
async function older(){const c=cur,b=$('#msgs'),first=MSG[0]?.id;if(!first)return;
 const{data,error}=await SB.from('messages').select('*').eq('conversation_id',c.id).lt('id',first).order('id',{ascending:false}).limit(40);
 if(error)return toast(error.message);if(cur!==c)return;
 const o=data.reverse();await need(o.map(m=>m.sender_id));more=data.length===40;
 const h=b.scrollHeight;MSG=[...o,...MSG];
 // keep MSG capped at 200 in memory to save RAM
 if(MSG.length>200)MSG=MSG.slice(0,200);
 draw();b.scrollTop=b.scrollHeight-h;cput()}
const gone=id=>{MSG=MSG.filter(x=>x.id!==id);cput();document.getElementById('m'+id)?.remove()};
function delMsg(m){const o=modal('Delete message',
 el('button',{on:{click:async()=>{const{error}=await SB.from('message_hides').insert({user_id:me.id,message_id:m.id});if(error)return toast(error.message);gone(m.id);o.remove()}}},'Delete for me'),
 m.sender_id===me.id&&el('button',{style:'color:#e53935',on:{click:async()=>{const{error}=await SB.from('messages').delete().eq('id',m.id);if(error)return toast(error.message);gone(m.id);o.remove()}}},'Delete for everyone'))}

async function url(m,d){const{data}=await SB.storage.from('chat-files').createSignedUrl(m.file_path,3600,d?{download:m.file_name}:undefined);return data?.signedUrl}
async function dl(m){const u=await url(m,1);u?location.href=u:toast('File not available')}
function addMsg(m){if(!MSG.some(x=>x.id===m.id)){MSG.push(m);cput()}paint(m)}
function paint(m,q){const b=$('#msgs');if(!b||document.getElementById('m'+m.id))return;
 const mine=m.sender_id===me.id,s=P[m.sender_id]||{},bub=el('div',{c:'bub'}),near=b.scrollHeight-b.scrollTop-b.clientHeight<150;
 if(m.file_path){
  if(m.kind==='image'||m.kind==='video'){const w=el('div',{c:'med'},'Loading...');bub.append(w);
   url(m).then(u=>{w.textContent='';if(u)w.append(m.kind==='image'?el('img',{src:u,on:{click:()=>window.open(u)}}):el('video',{src:u,controls:true,preload:'metadata'}))});
   bub.append(el('a',{href:'#',c:'file',on:{click:e=>{e.preventDefault();dl(m)}}},'⬇ '+m.file_name+' ('+sz(m.file_size||0)+')'))}
  else bub.append(el('a',{href:'#',c:'file',on:{click:e=>{e.preventDefault();dl(m)}}},'📄 '+m.file_name+' ('+sz(m.file_size||0)+')'))}
 if(m.body)bub.append(el('div',{c:'tx'},m.body));
 b.append(el('div',{c:'row'+(mine?' me':''),id:'m'+m.id},mine?null:av(s,28),
  el('div',{c:'col'},!mine&&cur.type!=='dm'&&el('small',{},s.username),bub,el('small',{},tm(m.created_at))),
  el('button',{c:'x',title:'Delete',on:{click:()=>delMsg(m)}},'🗑')));
 if(!q&&(near||mine))b.scrollTop=b.scrollHeight}

async function send(){const ta=$('#ta');if(!ta||!cur)return;const t=ta.value.trim(),c=cur;if(!t)return;ta.value='';
 if(t.length>100000)return upFile(new File([t],'long-text.txt',{type:'text/plain'}));
 const{data,error}=await SB.from('messages').insert({conversation_id:c.id,sender_id:me.id,body:t}).select().single();
 if(error){ta.value=t;return toast(error.message)}
 if(cur===c){addMsg(data);const idx=CH.findIndex(x=>x.id===c.id);if(idx>0){const[cv]=CH.splice(idx,1);cv.last_msg_at=data.created_at;CH.unshift(cv);cset('CH:'+me.id,CH);renderChats()}}}
async function upFile(f){if(!cur)return;const c=cur,st=$('#st');
 if(f.size>MAXF)return toast(f.name+': too large (free plan max 50 MB per file)');
 st.textContent='Uploading '+f.name+' ...';const path=`${c.id}/${me.id}/${crypto.randomUUID()}`;
 const{error}=await SB.storage.from('chat-files').upload(path,f,{contentType:f.type||'application/octet-stream'});
 if(error)toast(error.message);else{const k=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'file';
  const r=await SB.from('messages').insert({conversation_id:c.id,sender_id:me.id,kind:k,file_path:path,file_name:f.name,file_size:f.size,file_mime:f.type}).select().single();
  if(r.error)toast(r.error.message);else if(cur===c)addMsg(r.data)}
 st.textContent=''}
