<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><title>FC-100MS Scientific Calculator</title>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a}}

*{box-sizing:border-box}

</style></head><body>
<div id="calc">
 <div id="top"><div id="logo">Flair</div><div id="model">FC-100MS</div><div id="sci">SCIENTIFIC CALCULATOR</div></div>
 <div id="lcd"><div id="ind"><span id="iS">S</span><span id="iA">A</span><span id="iM">M</span><span id="iSTO">STO</span><span id="iRCL">RCL</span><span id="iH">HYP</span><span id="iD">D</span><span id="iR">R</span><span id="iG">G</span><span id="iE">ENG</span><span id="iMath">Math</span></div><div id="l1"></div><div id="l2">0</div></div>
 <div id="h"><div class="grp" id="bS"></div><div class="grp" id="bA"></div><div id="pad"><b>COPY</b><span>REPLAY</span></div><div class="grp" id="bM"></div><div class="grp" id="bO"></div></div>
 <div id="rows"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let tokens=[],cur=0,shift=0,alpha=0,hyp=0,mode='D',ans=0,pend=null,menu=null,fresh=0,res='0',view='dec',eng=0,off=0,hist=[],hi=0,l1note='';
const vars={A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0};
const disp={nPr:'P',nCr:'C',RAN:'Ran#'};
class SynErr extends Error{}
const cfg={disp:'line'},KEY='fc100ms_state_v2';
const dv0=()=>cfg.disp==='math'?'exact':'dec';
function save(){try{localStorage.setItem(KEY,JSON.stringify({disp:cfg.disp,mode,eng,ans,vars,hist:hist.slice(-50)}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
 if(d.disp==='math'||d.disp==='line')cfg.disp=d.disp;
 if(['D','R','G'].includes(d.mode))mode=d.mode;
 eng=d.eng?1:0;
 if(Number.isFinite(d.ans))ans=d.ans;
 if(d.vars)for(const k in vars)if(Number.isFinite(d.vars[k]))vars[k]=d.vars[k];
 if(Array.isArray(d.hist))hist=d.hist.filter(h=>Array.isArray(h)&&h.every(t=>typeof t==='string')).slice(-50);
 hi=hist.length}catch(e){}}
function resetAll(){try{localStorage.removeItem(KEY)}catch(e){}
 tokens=[];cur=0;shift=0;alpha=0;hyp=0;mode='D';ans=0;pend=null;menu=null;fresh=0;res='0';eng=0;off=0;hist=[];hi=0;l1note='';cfg.disp='line';view=dv0();
 Object.keys(vars).forEach(k=>vars[k]=0)}
const SETUP=[
{n:()=>'Disp:'+(cfg.disp==='math'?'Math':'Line'),f:()=>{cfg.disp=cfg.disp==='math'?'line':'math';view=dv0();if(fresh&&!/^[A-FXYM]=/.test(res)&&!/ERROR/.test(res))showAns()}},
{n:()=>'Ang:'+({D:'Deg',R:'Rad',G:'Gra'})[mode],f:()=>{mode=mode==='D'?'R':mode==='R'?'G':'D'}},
{n:()=>'ENG:'+(eng?'on':'off'),f:()=>{eng=eng?0:1;if(fresh)showAns()}},
{n:()=>'ClrHist',f:()=>{menu={type:'confirm',what:'hist'}}},
{n:()=>'Reset',f:()=>{menu={type:'confirm',what:'all'}}}];
function menuItems(){return menu.type==='const'?CONSTS.map(c=>c.n):menu.type==='conv'?CONVS.map(c=>c.n):menu.type==='setup'?SETUP.map(x=>x.n()):['Yes','No']}

/* ---------- constants & conversions ---------- */
const CONSTS=[
{n:'c',v:299792458},{n:'h',v:6.62607015e-34},{n:'e',v:1.602176634e-19},{n:'NA',v:6.02214076e23},{n:'g',v:9.80665},
{n:'k',v:1.380649e-23},{n:'R',v:8.314462618},{n:'G',v:6.6743e-11},{n:'me',v:9.1093837015e-31},{n:'mp',v:1.67262192369e-27},
{n:'mn',v:1.67492749804e-27},{n:'ε0',v:8.8541878128e-12},{n:'μ0',v:1.25663706212e-6},{n:'ħ',v:1.054571817e-34},{n:'a0',v:5.29177210903e-11},
{n:'F',v:96485.33212},{n:'σ',v:5.670374419e-8},{n:'Vm',v:0.022413969545},{n:'atm',v:101325},{n:'u',v:1.6605390666e-27}];
const mul=k=>v=>v*k,dv=k=>v=>v/k;
const CONVS=[
{n:'in▶cm',f:mul(2.54)},{n:'cm▶in',f:dv(2.54)},{n:'ft▶m',f:mul(0.3048)},{n:'m▶ft',f:dv(0.3048)},{n:'mi▶km',f:mul(1.609344)},
{n:'km▶mi',f:dv(1.609344)},{n:'yd▶m',f:mul(0.9144)},{n:'m▶yd',f:dv(0.9144)},{n:'lb▶kg',f:mul(0.45359237)},{n:'kg▶lb',f:dv(0.45359237)},
{n:'oz▶g',f:mul(28.349523125)},{n:'g▶oz',f:dv(28.349523125)},{n:'gal▶L',f:mul(3.785411784)},{n:'L▶gal',f:dv(3.785411784)},{n:'°F▶°C',f:v=>(v-32)*5/9},
{n:'°C▶°F',f:v=>v*9/5+32},{n:'°C▶K',f:v=>v+273.15},{n:'K▶°C',f:v=>v-273.15},{n:'atm▶Pa',f:mul(101325)},{n:'Pa▶atm',f:dv(101325)},
{n:'cal▶J',f:mul(4.184)},{n:'J▶cal',f:dv(4.184)},{n:'hp▶W',f:mul(745.69987158)},{n:'W▶hp',f:dv(745.69987158)},{n:'kmh▶ms',f:dv(3.6)}];

/* ---------- math helpers ---------- */
const af=()=>mode==='D'?Math.PI/180:mode==='G'?Math.PI/200:1;
const cl=x=>Math.round(x*1e12)/1e12;
const FACT=n=>{if(!Number.isInteger(n)||n<0||n>69)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const NPR=(n,r)=>{if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r)return NaN;let p=1;for(let i=0;i<r;i++)p*=n-i;return p};
const NCR=(n,r)=>{if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r)return NaN;r=Math.min(r,n-r);let c=1;for(let i=1;i<=r;i++)c=c*(n-r+i)/i;return c<1e15?Math.round(c):c};
const ROOT=(n,v)=>{if(n===0||!Number.isFinite(n))return NaN;if(v<0)return(Number.isInteger(n)&&Math.abs(n%2)===1)?-Math.pow(-v,1/n):NaN;return Math.pow(v,1/n)};
const INTEG=(g,a,b)=>{const n=1000,h=(b-a)/n;let s=g(a)+g(b);for(let i=1;i<n;i++)s+=g(a+i*h)*(i%2?4:2);return s*h/3};
const DERIV=(g,x)=>{const h=1e-3*Math.max(1,Math.abs(x));return(-g(x+2*h)+8*g(x+h)-8*g(x-h)+g(x-2*h))/(12*h)};
const FNS={
sin:v=>cl(Math.sin(v*af())),cos:v=>cl(Math.cos(v*af())),
tan:v=>{const a=v*af();return Math.abs(Math.cos(a))<1e-12?NaN:cl(Math.tan(a))},
asin:v=>Math.asin(v)/af(),acos:v=>Math.acos(v)/af(),atan:v=>Math.atan(v)/af(),
sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,asinh:Math.asinh,acosh:Math.acosh,atanh:Math.atanh,
sqrt:Math.sqrt,cbrt:Math.cbrt,log10:Math.log10,ln:Math.log,p10:v=>Math.pow(10,v),exp:Math.exp};
const FN={'√(':'sqrt','³√(':'cbrt','log(':'log10','ln(':'ln','10^(':'p10','e^(':'exp'};
['sin','cos','tan'].forEach(n=>{FN[n+'(']=n;FN[n+'h(']=n+'h';FN[n+'⁻¹(']='a'+n;FN[n+'h⁻¹(']='a'+n+'h'});

/* ---------- recursive-descent parser: tokens -> closure f(x) (x overrides variable X) ---------- */
function parse(tk){
 let p=0;
 const peek=()=>tk[p],isNum=t=>t!==undefined&&/^[0-9.]$/.test(t);
 const startsPrimary=t=>t!==undefined&&(isNum(t)||t==='('||/\($/.test(t)||/^(π|e|Ans|RAN)$/.test(t)||/^[A-FXYM]$/.test(t));
 const close=()=>{if(peek()===')')p++;else if(p<tk.length)throw new SynErr()};
 const comma=()=>{if(peek()===',')p++;else throw new SynErr()};
 function add(){let l=mul_();while(peek()==='+'||peek()==='−'){const o=tk[p++],r=mul_(),a=l;l=o==='+'?x=>a(x)+r(x):x=>a(x)-r(x)}return l}
 function mul_(){let l=perm();for(;;){const t=peek();let o;
  if(t==='×'||t==='÷'){p++;o=t}else if(startsPrimary(t))o='×';else break;
  const r=perm(),a=l;l=o==='×'?x=>a(x)*r(x):x=>a(x)/r(x)}return l}
 function perm(){let l=unary();while(/^(nPr|nCr|ˣ√)$/.test(peek()||'')){const o=tk[p++],r=unary(),a=l;
  l=o==='nPr'?x=>NPR(a(x),r(x)):o==='nCr'?x=>NCR(a(x),r(x)):x=>ROOT(a(x),r(x))}return l}
 function unary(){const t=peek();if(t==='−'){p++;const u=unary();return x=>-u(x)}if(t==='+'){p++;return unary()}return power()}
 function power(){const b=postfix();if(peek()==='^'){p++;const e=powExp();return x=>Math.pow(b(x),e(x))}return b}
 function powExp(){if(peek()==='−'){p++;const u=powExp();return x=>-u(x)}if(peek()==='+'){p++;return powExp()}return power()}
 function postfix(){let v=primary();for(;;){const t=peek(),a=v;
  if(t==='²'){p++;v=x=>a(x)*a(x)}
  else if(t==='³'){p++;v=x=>Math.pow(a(x),3)}
  else if(t==='⁻¹'){p++;v=x=>1/a(x)}
  else if(t==='!'){p++;v=x=>FACT(a(x))}
  else if(t==='%'){p++;v=x=>a(x)/100}
  else if(t==='ᴇ'){p++;let s=1;if(peek()==='−'){p++;s=-1}else if(peek()==='+')p++;
   let d='';while(isNum(peek()))d+=tk[p++];if(!d||isNaN(+d))throw new SynErr();const n=s*+d;v=x=>a(x)*Math.pow(10,n)}
  else break}return v}
 function primary(){const t=tk[p];if(t===undefined)throw new SynErr();
  if(isNum(t)){let d='';while(isNum(peek()))d+=tk[p++];if((d.match(/\./g)||[]).length>1||d==='.')throw new SynErr();const n=+d;return()=>n}
  p++;
  if(t==='π')return()=>Math.PI;
  if(t==='e')return()=>Math.E;
  if(t==='Ans')return()=>ans;
  if(t==='RAN')return()=>Math.floor(Math.random()*1000)/1000;
  if(/^[A-FXYM]$/.test(t))return x=>x&&t in x?x[t]:vars[t];
  if(t==='('){const e=add();close();return e}
  if(t==='∫('){const g=add();comma();const a=add();comma();const b=add();close();return x=>INTEG(y=>g(Object.assign({},x,{X:y})),a(x),b(x))}
  if(t==='d/dx('){const f=add();comma();const pt=add();close();return x=>DERIV(y=>f(Object.assign({},x,{X:y})),pt(x))}
  if(FN[t]){const e=add();close();const f=FNS[FN[t]];return x=>f(e(x))}
  throw new SynErr()}
 const r=add();if(p<tk.length)throw new SynErr();return r}

/* ---------- display formatting ---------- */
function sci(m,e){return (+(+m).toPrecision(10))+'<small>×10</small><sup>'+(e<0?'-':'')+String(Math.abs(e)).padStart(2,'0')+'</sup>'}
function fmt(v){if(v===0)return'0';const a=Math.abs(v);
if(eng){const e=Math.floor(Math.log10(a)/3)*3;return sci(v/10**e,e)}
const sg=+v.toPrecision(10);if(a>=1e10||a<1e-9){let[m,e]=v.toExponential(9).split('e');return sci(m,+e)}
let s=sg.toFixed(Math.min(20,Math.max(0,9-Math.floor(Math.log10(a)))));if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s}
function dms(v){const n=v<0?'-':'',a=Math.abs(v);let d=Math.floor(a),r=(a-d)*60,m=Math.floor(r+1e-9),s=+((r-m)*60).toFixed(4);if(s>=60){s=0;m++}if(m>=60){m=0;d++}return n+d+'°'+m+'′'+s+'″'}
function fr(v,mixed){if(Number.isInteger(v))return fmt(v);const sg=v<0?'-':'',a=Math.abs(v),w=mixed?Math.floor(a):0,x=a-w;let h1=1,h0=0,k1=0,k0=1,y=x,n,d;
for(let i=0;i<20;i++){const q=Math.floor(y);n=q*h1+h0;d=q*k1+k0;h0=h1;h1=n;k0=k1;k1=d;if(Math.abs(x-n/d)<1e-10)break;y=1/(y-q)}
if(d>999||Math.abs(x-n/d)>1e-8)return fmt(v);return sg+(w?w+'⌟':'')+n+'⌟'+d}
function showAns(){
 if(cfg.disp==='math'&&window.katex&&!eng&&(view==='exact'||view==='mixed')){
  try{const t=view==='exact'?exactTex(ans):mixedTex(ans);if(t){res=ktx(t);return}}catch(e){}}
 res=view==='exact'&&!eng?exact(ans):view==='mixed'&&cfg.disp==='math'?mixedHTML(ans):view==='frac'?fr(ans):view==='mixed'?fr(ans,1):view==='dms'?dms(ans):fmt(ans)}

/* ---------- Math (natural) display ---------- */
/* ---------- LaTeX (KaTeX) renderer ---------- */
const ktx=t=>katex.renderToString(t,{throwOnError:false,trust:true,strict:false});
function rtex(tk,cursor){
 let p=0,placed=false,dp=0;
 const cr=i=>{if(i===cursor&&!placed){placed=true;return'\\htmlClass{kc}{\\rule[-0.3em]{1.5px}{1.2em}}'}return''};
 const isNum=t=>t!==undefined&&/^[0-9.]$/.test(t);
 const sp=t=>t!==undefined&&(isNum(t)||t==='('||/\($/.test(t)||/^(π|e|Ans|RAN)$/.test(t)||/^[A-FXYM]$/.test(t));
 const frac=(a,b)=>'\\frac{'+a+'}{'+b+'}';
 const rad=(h,idx)=>idx?'\\sqrt['+idx+']{'+h+'}':'\\sqrt{'+h+'}';
 const supt=(b,e)=>'{'+b+'}^{'+e+'}';
 const req=f=>{dp++;try{return f()}finally{dp--}};
 const ec=()=>{if(tk[p]===')'){const c=cr(p);p++;return[c,1]}return['',0]};
 const paren=(b,e,h)=>'\\left('+b+e+(h?'\\right)':'\\right.');
 const texOf=t=>({'π':'\\pi','e':'e','Ans':'\\mathrm{Ans}','RAN':'\\mathrm{Ran\\#}','×':'\\times ','÷':'\\div ','−':'-','%':'\\%','ᴇ':'\\mathrm{E}','nPr':'\\mathrm{P}','nCr':'\\mathrm{C}','ˣ√':'\\sqrt[x]{}'})[t]||t;
 function add(){let o=mul();while(tk[p]==='+'||tk[p]==='−'){const i=p++;o+=cr(i)+(tk[i]==='−'?'-':'+')+mul()}return o}
 function mul(){const parts=[perm()];
  for(;;){const t=tk[p];
   if(t==='×'){const i=p++;parts.push(cr(i)+'\\times ');parts.push(perm())}
   else if(t==='÷'){const i=p++;const last=parts.pop()+cr(i);const r=req(perm);parts.push(frac(last,r))}
   else if(sp(t))parts.push(perm());
   else break}
  return parts.join('')}
 function perm(){let l=unary();while(/^(nPr|nCr|ˣ√)$/.test(tk[p]||'')){const i=p++,o=tk[i],r=unary();
  l=o==='ˣ√'?rad(r,l+cr(i)):l+cr(i)+(o==='nPr'?'\\mathrm{P}':'\\mathrm{C}')+r}return l}
 function unary(){const t=tk[p];if(t==='−'||t==='+'){const i=p++;return cr(i)+(t==='−'?'-':'+')+unary()}return power()}
 function power(){const b=postfix();if(tk[p]==='^'){const i=p++;return supt(b+cr(i),req(powExp))}return b}
 function powExp(){const t=tk[p];if(t==='−'||t==='+'){const i=p++;return cr(i)+(t==='−'?'-':'+')+powExp()}return power()}
 function postfix(){let v=primary();for(;;){const t=tk[p],i=p;
  if(t==='²'||t==='³'){p++;v=supt(v+cr(i),t==='²'?'2':'3')}
  else if(t==='⁻¹'){p++;v=supt(v+cr(i),'-1')}
  else if(t==='!'){p++;v+=cr(i)+'!'}
  else if(t==='%'){p++;v+=cr(i)+'\\%'}
  else if(t==='ᴇ'){p++;let e='';if(tk[p]==='−'){e+=cr(p)+'-';p++}else if(tk[p]==='+')p++;
   while(isNum(tk[p])){e+=cr(p)+tk[p];p++}v+=cr(i)+'\\times 10^{'+e+'}'}
  else break}return v}

/* ---------- REPLAY pad: mouse + touch ---------- */
function padDir(cx,cy){const r=$('pad').getBoundingClientRect(),dx=cx-r.left-r.width/2,dy=cy-r.top-r.height/2;
 act(Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down'));draw()}
$('pad').addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];padDir(t.clientX,t.clientY)},{passive:false});
$('pad').addEventListener('click',e=>padDir(e.clientX,e.clientY));

/* ---------- keyboard ----------
 digits . + - * / ( ) ^ , Enter Backspace Escape arrows as usual
 s/c/t sin/cos/tan   S/C/T inverse   h hyp   l log   n ln   L 10^   N e^   r sqrt   R cbrt   u root
 p pi   e e   x x^2   i x^-1   ! factorial   % percent   a Ans   E EXP   P nPr   Q nCr
 k CONST   K CONV   U SETUP   m MODE(DRG)   M M+   f ab/c (n/d)   F d/c (mixed)   d DMS   g ENG   z "=" sign (for SOLVE)
 q STO   w RCL   (then a-f,x,y,m)    v + letter = insert variable    o ON   O OFF */
let kbv=0;
const KB={'+':'+','-':'−','*':'×','/':'÷','(':'(',')':')','^':'^','.':'•',',':',','Enter':'=','=':'=','Backspace':'DEL','Escape':'AC'};
const KL={s:'trig:sin',c:'trig:cos',t:'trig:tan',S:'trig:asin',C:'trig:acos',T:'trig:atan',h:'hyp',l:'t:log(',n:'t:ln(',L:'t:10^(',N:'t:e^(',r:'t:√(',R:'t:³√(',u:'t:ˣ√',
p:'t:π',e:'t:e',x:'t:²',i:'t:⁻¹','!':'t:!','%':'t:%',a:'t:Ans',E:'t:ᴇ',P:'t:nPr',Q:'t:nCr',k:'const',K:'conv',m:'mode',M:'mp',f:'frac',F:'mixed',d:'dms',g:'eng',z:'t:=',q:'sto',w:'rcl',O:'off',U:'setup'};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
if(off){if(k==='o'){off=0;draw()}return}
if(k.startsWith('Arrow')){act(k.slice(5).toLowerCase());draw();e.preventDefault();return}
const isVar=/^[a-fxym]$/i.test(k);
if((pend||kbv)&&isVar){e.preventDefault();const L=k.toUpperCase();
 if(pend){const p=pend;pend=null;act((p==='sto'?'stv:':'rcv:')+L)}else act('t:'+L);
 kbv=0;shift=alpha=0;draw();return}
pend=null;
if(k==='v'){kbv=1;e.preventDefault();return}
kbv=0;
if(/^[0-9]$/.test(k)&&keyMap[k]){e.preventDefault();press(keyMap[k]);return}
if(KB[k]&&keyMap[KB[k]]){e.preventDefault();press(keyMap[KB[k]]);return}
if(KL[k]){e.preventDefault();shift=alpha=0;act(KL[k]);draw()}});
