<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Writer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:#e9ebef;font-family:"Noto Sans Bengali",-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
button,select,input{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:2px;padding:6px 8px;background:#fafafa;border-bottom:1px solid #e3e3e3}
#top button{background:none;border:0;font-size:22px;padding:6px 10px;border-radius:8px;cursor:pointer}
#top button:active{background:#e6e6e6}
#top .t{font-size:17px}
.sp{flex:1}
#pg{border:2px solid #444;border-radius:4px;min-width:30px;text-align:center;font-size:14px;padding:2px 4px;margin-right:6px}
#mid{flex:1;min-height:0;position:relative;display:flex}
#wrap{flex:1;overflow:auto;padding:14px 8px 60px;position:relative}
#cnt{position:absolute;left:12px;bottom:10px;background:rgba(235,235,235,.95);color:#666;border-radius:6px;padding:4px 10px;font-size:14px}
#ed{background:#fff;margin:0 auto;width:min(100%,var(--pw));min-height:var(--ph);padding:min(var(--mm),6vw);outline:0;box-shadow:0 1px 4px rgba(0,0,0,.25);font:11pt/normal Calibri,Carlito,"Segoe UI","Noto Sans Bengali",Roboto,Arial,sans-serif;color:#1f1f1f;overflow-wrap:anywhere}
#ed p{margin:0 0 6pt}
#ed h1{font-size:18pt;margin:14pt 0 6pt}#ed h2{font-size:14pt;margin:16pt 0 6pt}#ed h3{font-size:12pt;margin:12pt 0 2pt}
#ed li{margin:0 0 3pt}
#ed blockquote{margin:0 0 0 32px}
#ed table{border-collapse:collapse;width:100%;margin:6pt 0}
#ed td,#ed th{border:1px solid #999;padding:4px 6px;min-width:28px;vertical-align:top}
#ed img{max-width:100%}
#ed .tb{border:1px solid #666;padding:8px;margin:6pt 0}
#ed .pb{border-top:1px dashed #aaa;margin:12px 0;height:0;position:relative}
#ed .pb::after{content:"Page break";font-size:10px;color:#999;position:absolute;right:0;top:-7px;background:#fff;padding:0 4px}
#panel{background:#fff;border-top:1px solid #ddd}
#tabs{display:flex;align-items:center;border-bottom:1px solid #e6e6e6;overflow-x:auto}
#tabs button{background:none;border:0;padding:12px 14px;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:#3b82f6;border-color:#3b82f6}
#tabs .ic{font-size:20px;padding:10px 12px}
#pbody{max-height:42vh;overflow:auto;padding:10px 12px;background:#f6f6f7}
section{display:none}section.on{display:block}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:6px 10px}
.row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;justify-content:space-around;align-items:center;padding:2px}
.seg button,.st button{background:none;border:0;font-size:19px;min-width:40px;height:40px;border-radius:8px;cursor:pointer}
.seg button.on{background:#e4e7ec}
.st{display:flex;align-items:center;justify-content:space-between}
.st b{font-size:24px;color:#3b82f6;font-weight:500}
small{color:#555;font-size:13px}
.lab{font-size:13px;color:#777;margin:6px 0 4px}
.dots{display:flex;justify-content:space-around;align-items:center;padding:10px 6px}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid #ccc;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.card select{width:100%;border:0;background:none;font-size:17px;text-align:center}
.list{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;background:#fff;border:0;border-bottom:1px solid #eee;text-align:left;font-size:16px;cursor:pointer}
.item:active{background:#f0f0f0}
.big{display:flex}.big button{flex:1;background:none;border:0;padding:12px 4px;font-size:14px;cursor:pointer}
.big span{display:block;font-size:22px}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1}
dialog{border:0;border-radius:14px;width:min(420px,92vw);padding:0;max-height:70vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.flow{font:11pt/normal Calibri,Carlito,"Segoe UI","Noto Sans Bengali",Roboto,Arial,sans-serif;color:#1f1f1f;overflow-wrap:anywhere}
#ed img,.flow img{max-width:100%;height:auto}
img[data-w=left]{float:left;margin:4px 12px 4px 0}img[data-w=right]{float:right;margin:4px 0 4px 12px}img[data-w=center]{display:block;margin:6px auto}
.flow img,.flow tr,.flow .tb{break-inside:avoid}
.flow .pb{break-after:column;border:0;margin:0}.flow .pb::after{display:none}
#ib{display:none;position:absolute;border:2px solid #3b82f6;pointer-events:none;z-index:5}
#ib *{pointer-events:auto}
#ih{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#3b82f6;border:3px solid #fff;touch-action:none}
#it{position:absolute;left:0;top:calc(100% + 8px);display:flex;gap:2px;background:#fff;border:1px solid #ccc;border-radius:8px;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#it button{background:none;border:0;font-size:17px;padding:6px 8px;border-radius:6px}
#ed{position:relative}#ed>*{overflow:visible}
#ed.pgv>*{padding-top:var(--pg,0px)}#ed.pgv>table,#ed.pgv>.tb{padding-top:0;margin-top:calc(6pt + var(--pg,0px))}
.pgs{display:none}#ed.pgv .pgs{display:block}
#ed>[data-sk]{content-visibility:hidden}
#knob{position:absolute;left:2px;top:0;width:28px;height:48px;border-radius:14px;background:rgba(59,130,246,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:6;touch-action:none;opacity:0;pointer-events:none;transition:opacity .2s}
#knob.show{opacity:1;pointer-events:auto}
img[data-w=front]{position:absolute;z-index:3;max-width:none}
#im{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:#3b82f6;color:#fff;border:3px solid #fff;touch-action:none;font-style:normal;text-align:center;line-height:22px;font-size:14px}
.item button{background:none;border:0;font-size:20px;padding:6px 8px}
@media print{
 html,body{height:auto;overflow:visible;background:#fff}body{display:block}
 #top,#panel,#cnt,#toast,dialog{display:none!important}
 #mid{display:block}#wrap{overflow:visible;padding:0}
 #ed{box-shadow:none;width:auto;min-height:0;padding:0;margin:0}
 #ed .pb{break-after:page;border:0}#ed .pb::after{display:none}
 #ed h1,#ed h2,#ed h3{break-after:avoid}#ed img,#ed tr,#ed .tb{break-inside:avoid}#ed.pgv>*{padding-top:0!important}#ed.pgv>table,#ed.pgv>.tb{margin-top:6pt!important}#ed .pgs{display:none!important}#ib{display:none!important}#ed>*{content-visibility:visible!important}#ed{zoom:1!important;width:auto!important;min-height:0!important;padding:0!important;background-image:none!important}
}
</style>
<style id="pgcss"></style>
<style id="pgsty"></style>
</head>
<body>
<div id="top">
  <button class="t" data-a="done" style="font-size:17px">Done</button>
  <button data-a="save" title="Save">💾</button>
  <button data-a="undo" title="Undo">↶</button>
  <button data-a="redo" title="Redo">↷</button>
  <button data-a="files" title="Files">📁</button>
  <button data-a="pview" title="Page view">📑</button>
  <span class="sp"></span>
  <b id="pg">1</b>
  <button data-a="new" title="New / clear">✕</button>
</div>
<div id="mid">
  <div id="wrap"><div id="ed" contenteditable="true" spellcheck="false" inputmode="none"></div><div id="ib"><i id="ih"></i><i id="im">✥</i><div id="it"><button data-w="inline" title="Inline">▭</button><button data-w="left" title="Wrap left">◧</button><button data-w="center" title="Center">▣</button><button data-w="right" title="Wrap right">◨</button><button data-w="front" title="Over text">⧉</button><button data-z="m">−</button><button data-z="p">+</button><button data-w="del">🗑</button></div></div></div>
  <span id="cnt">Full text: 0</span>
  <div id="knob">⇅</div>
</div>

<div id="panel">
  <div id="tabs">
    <button class="ic" data-a="fold">⌄</button>
    <button class="ic" data-a="kb">⌨</button>
    <button data-t="Home" class="on">Home</button>
    <button data-t="File">File</button>
    <button data-t="Insert">Insert</button>
    <button data-t="View">View</button>
    <button data-t="Review">Review</button>
  </div>
  <div id="pbody">
    <section id="s-Home" class="on">
      <div class="row">
        <div class="card st" style="flex:.8"><div style="width:100%"><small>Size</small><div class="st"><button data-a="szm">−</button><b id="szv">11</b><button data-a="szp">+</button></div></div></div>
        <div class="col">
          <div class="card"><button id="fs" data-a="fontpick" style="width:100%;border:0;background:none;font-size:17px;padding:6px 0;cursor:pointer">Calibri</button></div>
          <div class="card seg"><button class="tg" data-c="bold"><b>B</b></button><button class="tg" data-c="italic"><i>I</i></button><button class="tg" data-c="underline"><u>U</u></button><button class="tg" data-c="strikeThrough"><s>S</s></button></div>
        </div>
      </div>
      <div class="lab">Text Color</div>
      <div class="row"><div class="card dots" id="tc" style="flex:3"></div><button class="card" data-fc="#1f1f1f" style="color:#3b82f6;border-color:#3b82f6;cursor:pointer">Automatic</button></div>
      <div class="lab">Highlight</div>
      <div class="card dots" id="hc" style="margin-bottom:10px"></div>
      <div class="row">
        <div class="card" style="flex:.8"><small>Multiple</small><select id="ls"><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option><option selected>1</option><option>1.15</option><option>1.5</option><option>2</option><option>2.5</option></select></div>
        <div class="card seg"><button class="tg" data-c="justifyLeft">≡</button><button class="tg" data-c="justifyCenter">☰</button><button class="tg" data-c="justifyRight">☷</button><button class="tg" data-c="justifyFull">▤</button></div>
      </div>
      <div class="card seg" style="margin-bottom:6px">
        <button data-c="insertUnorderedList">•≡</button><button data-c="insertOrderedList">1.</button><button data-c="outdent">⇤</button><button data-c="indent">⇥</button>
        <button data-c="formatBlock" data-v="p">P</button><button data-c="formatBlock" data-v="h1"><b>H1</b></button><button data-c="formatBlock" data-v="h2"><b>H2</b></button><button data-c="formatBlock" data-v="h3"><b>H3</b></button>
      </div>
    </section>
    <section id="s-File">
      <div class="list">
        <button class="item" data-a="save">💾 Save</button>
        <button class="item" data-a="docx">📝 Save As Word (.docx)</button>
        <button class="item" data-a="pdf">📕 Export to PDF</button>
        <button class="item" data-a="html">🌐 Export as HTML</button>
        <button class="item" data-a="open">📂 Open Word (.docx)</button>
        <button class="item" data-a="files">📁 My files</button>
        <button class="item" data-a="fonts">🔤 My fonts</button>
        <button class="item" data-a="tpl">🧩 Q&amp;A style template</button>
      </div>
    </section>
    <section id="s-Insert">
      <div class="list">
        <button class="item" data-a="pic">🖼 Picture</button>
        <button class="item" data-a="tbx">🔲 Text Box</button>
        <button class="item" data-a="tbl">▦ Table</button>
        <button class="item" data-a="deltbl">🗑 Delete table</button>
        <button class="item" data-a="bp">📄 Blank Page (page break)</button>
        <button class="item" data-a="pn" id="pnb">🔢 Page Number</button>
        <button class="item" data-a="hf">🔖 Header &amp; Footer</button>
      </div>
    </section>
    <section id="s-View">
      <div class="list big"><button data-a="copy"><span>⧉</span>Copy</button><button data-a="paste"><span>📋</span>Paste</button><button data-a="cut"><span>✂</span>Cut</button></div>
      <div class="list"><button class="item" data-a="toc">☰ Content (headings)</button><button class="item" data-a="pview">📑 Page view (on/off)</button></div>
      <div class="lab">Page Setup</div>
      <div class="row">
        <div class="card"><small>Size</small><select id="psz"><option>A3</option><option>A4</option><option>A5</option><option>A6</option><option>B5</option><option>Letter</option><option>Legal</option></select></div>
        <div class="card"><small>Orientation</small><select id="por"><option value="0">Portrait</option><option value="1">Landscape</option></select></div>
        <div class="card"><small>Margin (mm)</small><select id="pmr"><option>5</option><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option></select></div>
      </div>
    </section>
    <section id="s-Review">
      <div class="list">
        <button class="item" data-a="fr">🔍 Find &amp; Replace</button>
        <button class="item" data-a="wc">🔢 Word count</button>
      </div>
    </section>
  </div>
</div>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="fontIn" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="openIn" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="color" id="tcI" hidden><input type="color" id="hcI" hidden>
<dialog id="dlg"><div id="dl"></div><button class="item" id="dx" style="justify-content:center;color:#3b82f6">Close</button></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),ed=$('#ed');
const S={sz:'A4',land:0,mar:20,hdr:'',ftr:'',pn:0},PS={A3:[297,420],A4:[210,297],A5:[148,210],A6:[105,148],B5:[176,250],Letter:[215.9,279.4],Legal:[215.9,355.6]};
const BLK=new Set(['DIV','P','H1','H2','H3','H4','UL','OL','LI','TABLE','BLOCKQUOTE','TR','TD','TH','TBODY']);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};

/* ---------- selection / exec ---------- */
let saved=null;
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();uiq()}});
let uq=0;const uiq=()=>{if(!uq)uq=requestAnimationFrame(()=>{uq=0;ui()})};
const rs=()=>{if(document.activeElement!==ed){ed.setAttribute('inputmode','none');ed.focus({preventScroll:true})}if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved)}};
const ex=(c,v)=>{rs();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);sync()};
const ins=h=>{rs();document.execCommand('insertHTML',false,h);tagImgs();sync()};
const blk=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return n};
function setSz(pt){
  pt=Math.max(6,Math.min(96,pt));rs();const s=getSelection();if(!s.rangeCount)return;let r=s.getRangeAt(0);
  if(r.collapsed){const b=blk(r.startContainer);if(!b||b===ed||!ed.contains(b))return;r=document.createRange();r.selectNodeContents(b);s.removeAllRanges();s.addRange(r)}
  document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,'7');
  ed.querySelectorAll('[style*="xxx-large"]').forEach(e=>e.style.fontSize=pt+'pt');
  saved=getSelection().getRangeAt(0).cloneRange();sync();ui();
}
function ui(){
  const n=saved&&saved.startContainer,e=n&&(n.nodeType===3?n.parentElement:n);
  if(e&&ed.contains(e)){
    const cs=getComputedStyle(e),f=cs.fontFamily.split(',')[0].replace(/["']/g,'').trim();
    $('#szv').textContent=Math.round(parseFloat(cs.fontSize)*1.5)/2;
    $('#fs').textContent=f;
  }
  document.querySelectorAll('.tg').forEach(b=>{try{b.classList.toggle('on',document.queryCommandState(b.dataset.c))}catch(x){}});
}

/* ---------- page / stats / persist ---------- */
function page(){
  let[w,h]=PS[S.sz];if(S.land)[w,h]=[h,w];
  const r=document.documentElement.style;r.setProperty('--pw',w+'mm');r.setProperty('--ph',h+'mm');r.setProperty('--mm',S.mar+'mm');
  const q=s=>'"'+s.replace(/[\\"]/g,'\\$&').replace(/\n/g,' ')+'"';
  const f=[S.ftr?q(S.ftr)+(S.pn?' " — "':''):'',S.pn?'counter(page)':''].filter(Boolean).join(' ');
  $('#pgcss').textContent=`@page{size:${w}mm ${h}mm;margin:${S.mar}mm;${S.hdr?`@top-center{content:${q(S.hdr)}}`:''}${f?`@bottom-center{content:${f}}`:''}}`;
  $('#psz').value=S.sz;$('#por').value=S.land;$('#pmr').value=S.mar;
  $('#pnb').textContent='🔢 Page Number '+(S.pn?'✓':'');tagImgs();view();
  stat();
}
function stat(){
  const t=ed.textContent;$('#cnt').textContent='Full text: '+((t?(t.match(/\S+/g)||[]).length:0)+rest.reduce((a,c)=>a+c.w,0));
  const h=PS[S.sz][S.land?0:1];$('#pg').textContent=Math.max(1,Math.ceil(ed.getBoundingClientRect().height/zm/(h*3.7795+(pvOn?12:0))*(rest.length?1+rest.reduce((a,c)=>a+c.w,0)/Math.max(1,(t.match(/\S+/g)||[]).length):1)));
}
let sel=null,pvOn=0,cur={},zm=1,rest=[],LW=1;
const DB=new Promise(r=>{try{const q=indexedDB.open('writer',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=async(m,v)=>{const d=await DB;if(!d)return null;return new Promise(r=>{try{const s=d.transaction('f',m==='all'||m==='get'?'readonly':'readwrite').objectStore('f'),q=m==='all'?s.getAll():m==='get'?s.get(v):m==='del'?s.delete(v):s.put(v);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})};
const persist=()=>{idb('put',{id:'draft',h:fullHtml(),S:{...S},cur});return 1};
let pt;const sync=()=>{if(sel)pick(sel.isConnected?sel:null);later(1);clearTimeout(pt);pt=setTimeout(persist,3000)};
ed.addEventListener('input',sync);
ed.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));sync()});
try{const d=JSON.parse(localStorage.getItem('writer_doc'));if(d){ed.innerHTML=d.h;Object.assign(S,d.S)}}catch(e){}
if(!ed.innerHTML.trim())ed.innerHTML='<p><br></p>';
document.execCommand('defaultParagraphSeparator',false,'p');

/* ---------- color dots ---------- */
const dots=(id,cols,at,ci)=>{$(id).innerHTML=cols.map(c=>c==='none'?`<span class="dot" ${at}="transparent">⊘</span>`:`<span class="dot" style="background:${c}" ${at}="${c}"></span>`).join('')+`<span class="dot" onclick="$('${ci}').click()">⋯</span>`};
dots('#tc',['#323338','#c00000','#ffc000','#92d050','#00a0e9'],'data-fc','#tcI');
dots('#hc',['#ffff00','#00ff00','#00ffff','#ff00ff','#ff0000','none'],'data-hc','#hcI');
$('#tcI').oninput=e=>ex('foreColor',e.target.value);$('#hcI').oninput=e=>ex('hiliteColor',e.target.value);

/* ---------- panel events ---------- */
document.addEventListener('mousedown',e=>{if(e.target.closest('#panel,#top')&&!e.target.closest('select,input'))e.preventDefault()});
$('#ls').onchange=e=>{rs();const r=getSelection().getRangeAt(0);[...ed.children].forEach(c=>{if(r.intersectsNode(c))c.style.lineHeight=+e.target.value===1?"normal":(e.target.value*1.25).toFixed(2)});sync()};
$('#psz').onchange=e=>{S.sz=e.target.value;page();persist()};$('#por').onchange=e=>{S.land=+e.target.value;page();persist()};$('#pmr').onchange=e=>{S.mar=+e.target.value;page();persist()};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;
  document.querySelectorAll('#tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.t));$('#pbody').style.display=''});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-c],[data-a],[data-fc],[data-hc]');if(!b)return;const d=b.dataset;
  if(d.c)ex(d.c,d.v);else if(d.fc)ex('foreColor',d.fc);else if(d.hc)ex('hiliteColor',d.hc);else A[d.a]&&A[d.a]();
});
$('#dx').onclick=()=>$('#dlg').close();

const A={
  done(){$('#pbody').style.display='none';ed.blur();getSelection().removeAllRanges()},
  fold(){const p=$('#pbody');p.style.display=p.style.display==='none'?'':'none'},
  kb(){if(ed.getAttribute('inputmode')==='none'||document.activeElement!==ed)ed.click();else ed.blur()},
  async save(){loadAll();if(!cur.id)cur={id:'f_'+Date.now()};
